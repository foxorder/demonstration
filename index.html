/* Simulation de retraite : trois hypothèses, une fourchette et sa ligne médiane */
function simulerRetraite() {
  const R = FICTIF.retraite, ageActuel = age(R.naissance), depart = etat.retraite.age;
  const besoin = Math.max(0, etat.retraite.revenu - R.pensions) * 12;
  const res = {};
  R.hypotheses.forEach(h => {
    let c = financier();
    const t = [{ age: ageActuel, v: c }];
    for (let a = ageActuel + 1; a <= 90; a++) {
      c = c * (1 + h.taux / 100);
      if (a <= depart) c += R.epargneAnnuelle; else c -= besoin;
      if (c < 0) c = 0;
      t.push({ age: a, v: c });
    }
    res[h.id] = t;
  });
  const epuise = id => { const z = res[id].find(p => p.v <= 0); return z ? z.age : null; };
  return { ageActuel: ageActuel, depart: depart, besoin: besoin, res: res, epuise: { bas: epuise('bas'), milieu: epuise('milieu'), haut: epuise('haut') } };
}

  const vmax = Math.max.apply(null, sim.res.haut.map(p => p.v));
  const pas = vmax > 3e6 ? 1e6 : 5e5;

  let s = '<svg viewBox="0 0 ' + L + ' ' + H + '" width="' + L + '" height="' + H + '" tabindex="0" role="img" aria-label="Capital financier simulé selon trois hypothèses, de ' + a0 + ' à 90 ans. Utilisez les flèches pour lire chaque âge."><g class="axe mnt-g">';
  for (let v = 0; v <= y1 + 1; v += pas) {

    s += '<text x="0" y="' + (Y(v) + 4) + '">' + (v === 0 ? '0' : millions(v)) + '</text>';

  s += '<line x1="' + X(sim.depart) + '" x2="' + X(sim.depart) + '" y1="' + (m.h - 6) + '" y2="' + (H - m.b) + '" stroke="var(--terracotta)" stroke-width="1"/>';

  s += '<path d="' + cheminLigne(haut) + '" fill="none" stroke="#7F9A91" stroke-width="1.5"/>';

  const P = positions(lignes()), uniq = f => Array.from(new Set(P.map(f)));
  return { etabs: uniq(etabDe), tits: uniq(x => nomTitulaire(x.titulaire)), supports: uniq(x => x.nom) };
}
function adresseVue() {
  const f = etat.f; let a = 'patrimoine';
  if (f['pat-classe'] !== 'toutes') a += '-' + AD_CLASSES[f['pat-classe']];
  if (f['pat-env'] !== 'toutes') a += '-dans-' + AD_ENVELOPPES[f['pat-env']];
  if (f['pat-support'] !== 'tous') a += '-support-' + enSlug(f['pat-support']);
  if (f['pat-etab'] !== 'tous') a += '-chez-' + enSlug(f['pat-etab']);
  if (f['pat-tit'] !== 'tous') a += '-detenu-par-' + enSlug(f['pat-tit']);
  if (f['pat-preuve'] !== 'toutes') a += '-' + f['pat-preuve'];
  if (f.perimetre !== 'famille') a += '-de-' + AD_QUI[f.perimetre];
  if (f['pat-groupe'] !== 'enveloppe' || a !== 'patrimoine') a += '-par-' + AD_GROUPES[f['pat-groupe']];

}
function lireAdresseVue(h) {
  const V = valeursVue(), f = etat.f, inv = o => Object.keys(o).map(k => [o[k], k]);
  Object.assign(f, VUE_NEUTRE, { 'pat-groupe': 'enveloppe', perimetre: 'famille' });
  const tables = [
    ['-dans-', inv(AD_ENVELOPPES), 'pat-env'], ['-support-', V.supports.map(x => [enSlug(x), x]), 'pat-support'], ['-chez-', V.etabs.map(x => [enSlug(x), x]), 'pat-etab'],
    ['-detenu-par-', V.tits.map(x => [enSlug(x), x]), 'pat-tit'], ['-de-', inv(AD_QUI), 'perimetre'], ['-par-', inv(AD_GROUPES), 'pat-groupe'],
    ['-', [['prouve', 'prouve'], ['declare', 'declare']], 'pat-preuve'], ['-', inv(AD_CLASSES), 'pat-classe']
  ];
  let r = h.slice('patrimoine'.length), avance = true;
  while (r && avance) {
    avance = false;
    for (const t of tables) {
      if (r.indexOf(t[0]) !== 0) continue;
      const reste = r.slice(t[0].length);
      const trouve = t[1].slice().sort((a, b) => b[0].length - a[0].length).find(x => reste === x[0] || reste.indexOf(x[0] + '-') === 0);
      if (trouve) { f[t[2]] = trouve[1]; r = reste.slice(trouve[0].length); avance = true; break; }
    }
  }
}
function appliquerAdresse() {

/* ---------- Patrimoine : une vue = des filtres, un regroupement, un tri. Aucune combinaison n'est interdite. ----------
   Tout se calcule sur le contenu réel des enveloppes (chaque fonds, chaque poche d'espèces), puis se regroupe à la demande :
   « les actions, par enveloppe », « l'assurance vie, par classe d'actifs », « la Banque du Parc, par support »… */
const CLASSES_PAT = [['toutes', 'toutes les classes'], ['actions', 'les actions'], ['oblig', 'les obligations'], ['immo', 'l’immobilier'], ['noncote', 'le non coté'], ['liq', 'les liquidités']];

const TRIS_PAT = [['valeur-desc', 'Les plus gros d’abord'], ['valeur-asc', 'Les plus petits d’abord'], ['nom', 'De A à Z'], ['perf', 'Meilleure performance'], ['date', 'Mis à jour récemment']];
const PREUVES_PAT = [['toutes', 'Prouvé et déclaré'], ['prouve', 'Prouvé seulement'], ['declare', 'Déclaré seulement']];
const DIMS_PAT = {
  enveloppe: { cle: p => p.env, nom: p => p.envNom, un: 'enveloppe', des: 'enveloppes' },
  classe: { cle: p => p.classe, nom: p => CLASSES[p.classe].nom, un: 'classe d’actifs', des: 'classes d’actifs' },
  support: { cle: p => p.nom, nom: p => p.nom, un: 'support', des: 'supports' },
  etab: { cle: p => p.etabN, nom: p => p.etabN, un: 'établissement', des: 'établissements' },
  titulaire: { cle: p => p.tit, nom: p => p.tit, un: 'détenteur', des: 'détenteurs' },
  preuve: { cle: p => p.preuve === 'prouve' ? 'prouve' : 'declare', nom: p => p.preuve === 'prouve' ? 'Prouvé par vos relevés' : 'Déclaré', un: 'niveau de preuve', des: 'niveaux de preuve' }
};
function nomTitulaire(t) { return t === 'Claire et Étienne' ? 'En commun' : t; }
/* Le contenu des enveloppes, avec de quoi le filtrer et le regrouper */
function positionsVue(L) {
  return positions(L).map(p => {
    const l = L.find(x => x.id === p.parent);
    return Object.assign(p, { env: p.parent, envNom: affLigne(l).court, etabN: etabDe(p), tit: nomTitulaire(p.titulaire), perfL: l.perf === undefined ? null : l.perf, compose: !!l.composition });
  });
}
function nEnveloppes(n) { return n + (n > 1 ? ' enveloppes' : ' enveloppe'); }
/* Une rangée de la vue : un groupe, son montant, et sa part découpée par classe d'actifs */
function rangVue(g, dimCle, total, max, L) {
  const classes = ORDRE_CLASSES.filter(c => g.classes[c] > 0), dominante = classes.slice().sort((a, b) => g.classes[b] - g.classes[a])[0];
  const nEnv = Object.keys(g.envs).length, un = g.items[0];
  let icone = 'patrimoine', teinte = true, sous = nEnveloppes(nEnv), meta = pct(total ? g.valeur / total * 100 : 0, 0), attributs = 'data-a="creuser" data-g="' + dimCle + '" data-v="' + ech(g.cle) + '"';
  if (dimCle === 'enveloppe') {
    const l = L.find(x => x.id === g.cle), aff = affLigne(l);
    icone = aff.icone;
    sous = (l.part && l.part < 1 ? 'Part de ' + pct(l.part * 100, 0) + ', ' : '') + (aff.sous ? aff.sous.replace(/ · /g, ', ') : l.etab + ', ' + (l.titulaire === 'Claire et Étienne' ? 'en commun' : l.titulaire));
    meta = '<span class="point-p' + (l.preuve === 'prouve' ? '' : ' d') + '"></span>' + (l.preuve === 'prouve' ? 'Prouvé' : 'Déclaré');
    attributs = 'data-a="voir-ligne" data-id="' + l.id + '"';
  } else if (dimCle === 'support') {
    icone = un.compose ? 'investir' : affLigne(L.find(x => x.id === un.env)).icone;
    sous = nEnv > 1 ? 'Dans ' + nEnveloppes(nEnv) : un.compose ? un.envNom : un.etabN + ', ' + (un.tit === 'En commun' ? 'en commun' : un.tit);
  } else if (dimCle === 'etab') { icone = g.cle === 'Détention directe' ? 'cle' : 'banque'; teinte = false; }
  else if (dimCle === 'titulaire') { icone = g.cle === 'En commun' ? 'famille' : g.cle === 'SCI Lambert' ? 'immeuble' : 'personne'; teinte = false; }
  else if (dimCle === 'preuve') { icone = g.cle; teinte = false; }
  const melange = classes.length > 1 ? '<span class="sr"> Répartition : ' + classes.map(c => minuscule(CLASSES[c].court) + ' ' + pct(g.classes[c] / g.valeur * 100, 0)).join(', ') + '.</span>' : '';
  return '<button class="rang libre" ' + attributs + ' data-cle="vue-' + ech(g.cle) + '">' +
    '<span class="ic' + (teinte ? ' classe" style="--cc:' + CLASSES[dominante].hex : '') + '">' + I(icone, 20) + '</span>' +
    '<span class="mil"><span class="t">' + g.nom + '</span><span class="s">' + sous + melange + '</span></span>' +
    '<span class="fin"><span class="v mnt">' + eur(g.valeur) + '</span><span class="m">' + meta + '</span></span>' +
    '<span class="part" aria-hidden="true"><span style="width:' + Math.max(2, g.valeur / max * 100).toFixed(1) + '%">' + classes.map(c => '<i style="flex:' + Math.round(g.classes[c]) + ';background:' + CLASSES[c].c + '"></i>').join('') + '</span></span></button>';
}
function vuePatrimoine() {
  const f = etat.f, perim = f.perimetre, famille = perim === 'famille';
  const L = lignesPerim(), D = dettesPerim();
  const avoirs = somme(L, l => l.valeur), credits = somme(D, d => d.restant), netP = avoirs - credits;
  const prouveP = somme(L.filter(l => l.preuve === 'prouve'), l => l.valeur);
  const nomP = PERIMETRES.find(p => p[0] === perim)[1];

  /* Chiffres clés */
  const kp = '<div class="kpis">' +
    kpi('Patrimoine net', mnt(netP), 'à jour au ' + dateJourMois(dateReporting()), null, 'fort') +
    kpi('Avoirs', mnt(avoirs), L.length + (L.length > 1 ? ' lignes' : ' ligne')) +
    kpi('Crédits', mnt(-credits), D.length ? D.length + (D.length > 1 ? ' crédits' : ' crédit') + ' en cours' : 'Aucun crédit', null, D.length ? 'du' : '') +
    kpi('Prouvé', pct(avoirs ? prouveP / avoirs * 100 : 0, 0), eur(prouveP) + ' sur relevés', 'Prouvé : un relevé d’opérations explique chaque position. Le reste est déclaré : estimations de l’immobilier, valeurs du non coté.') + '</div>';

  /* La vue : filtrer, regrouper, trier */
  let P = positionsVue(L);
  if (f['pat-classe'] !== 'toutes') P = P.filter(p => p.classe === f['pat-classe']);
  if (f['pat-env'] !== 'toutes') P = P.filter(p => p.env === f['pat-env']);
  if (f['pat-etab'] !== 'tous') P = P.filter(p => p.etabN === f['pat-etab']);
  if (f['pat-tit'] !== 'tous') P = P.filter(p => p.tit === f['pat-tit']);
  if (f['pat-preuve'] !== 'toutes') P = P.filter(p => (p.preuve === 'prouve') === (f['pat-preuve'] === 'prouve'));
  if (f['pat-support'] !== 'tous') P = P.filter(p => p.nom === f['pat-support']);
  const q = f['pat-cherche'].trim().toLowerCase();
  if (q) P = P.filter(p => (p.nom + ' ' + p.envNom + ' ' + p.etabN + ' ' + p.tit + ' ' + CLASSES[p.classe].nom).toLowerCase().indexOf(q) >= 0);
  const dimCle = f['pat-groupe'], dim = DIMS_PAT[dimCle], G = {};
  P.forEach(p => {
    const k = dim.cle(p), g = G[k] || (G[k] = { cle: k, nom: dim.nom(p), valeur: 0, classes: {}, envs: {}, items: [] });
    g.valeur += p.valeur; g.classes[p.classe] = (g.classes[p.classe] || 0) + p.valeur; g.envs[p.env] = 1; g.items.push(p);
  });
  const T = Object.keys(G).map(k => G[k]);
  const perfG = g => (dimCle === 'enveloppe' && g.items[0].perfL !== null ? g.items[0].perfL : -99);
  const dateG = g => g.items.reduce((m, p) => (p.date > m ? p.date : m), '');
  T.sort({
    'valeur-desc': (a, b) => b.valeur - a.valeur, 'valeur-asc': (a, b) => a.valeur - b.valeur,
    'nom': (a, b) => a.nom.localeCompare(b.nom, 'fr'),
    'perf': (a, b) => perfG(b) - perfG(a) || b.valeur - a.valeur,
    'date': (a, b) => (dateG(b) > dateG(a) ? 1 : dateG(b) < dateG(a) ? -1 : b.valeur - a.valeur)
  }[f['pat-tri']]);
  const total = somme(P, p => p.valeur), max = T.reduce((m, g) => Math.max(m, g.valeur), 1);
  const actif = { classe: f['pat-classe'] !== 'toutes', env: f['pat-env'] !== 'toutes', etab: f['pat-etab'] !== 'tous', tit: f['pat-tit'] !== 'tous', preuve: f['pat-preuve'] !== 'toutes', support: f['pat-support'] !== 'tous', cherche: !!q };
  const filtre = Object.keys(actif).some(k => actif[k]);

  /* La phrase : trois menus déroulants disent ce que l'on regarde */
  const enveloppes = [['toutes', 'toutes les enveloppes']].concat(L.map(l => [l.id, affLigne(l).court]).sort((a, b) => a[1].localeCompare(b[1], 'fr')));
  if (actif.env && !L.some(l => l.id === f['pat-env'])) enveloppes.push([f['pat-env'], affLigne(ligne(f['pat-env'])).court]);
  const phrase = '<div class="phrase" role="group" aria-label="Choisir la vue">' +
    '<span class="gr"><span class="mot">Voir</span>' + sel('pat-classe', f['pat-classe'], CLASSES_PAT, 'Classe d’actifs', null, false, actif.classe) + '</span>' +
    '<span class="gr"><span class="mot">dans</span>' + sel('pat-env', f['pat-env'], enveloppes, 'Enveloppe', null, false, actif.env) + '</span>' +
    '<span class="gr"><span class="mot">par</span>' + sel('pat-groupe', dimCle, GROUPES_PAT, 'Regrouper par') + '</span></div>';

  /* Les autres filtres, repliés ; ceux qui sont actifs restent visibles et se retirent d'un geste */
  const V = valeursVue(), ouvert = !!etat.ouvert['pat-filtres'];
  const retirer = (g, neutre, libelle) => '<button type="button" class="chip" aria-pressed="true" data-a="filtre" data-g="' + g + '" data-v="' + neutre + '" data-cle="retire-' + g + '"><span class="sr">Retirer le filtre : </span>' + libelle + I('fermer', 14) + '</button>';
  const autres = '<div class="plus-f"><button type="button" class="btn texte" data-a="deplier" data-id="pat-filtres" data-cle="plus-filtres" aria-expanded="' + ouvert + '">' + (ouvert ? 'Moins de filtres' : 'Plus de filtres') + '</button>' +
    (actif.etab ? retirer('pat-etab', 'tous', f['pat-etab']) : '') + (actif.tit ? retirer('pat-tit', 'tous', f['pat-tit']) : '') +
    (actif.preuve ? retirer('pat-preuve', 'toutes', f['pat-preuve'] === 'prouve' ? 'Prouvé' : 'Déclaré') : '') + (actif.support ? retirer('pat-support', 'tous', f['pat-support']) : '') +
    (filtre ? '<button type="button" class="btn texte" data-a="effacer-filtres" data-cle="effacer">Tout effacer</button>' : '') + '</div>' +
    (ouvert ? '<div class="filtres-2">' +
      sel('pat-etab', f['pat-etab'], [['tous', 'Tous les établissements']].concat(V.etabs.sort((a, b) => a.localeCompare(b, 'fr')).map(e => [e, e])), 'Filtrer par établissement', 'banque', false, actif.etab) +
      sel('pat-tit', f['pat-tit'], [['tous', 'Tous les détenteurs']].concat(V.tits.map(e => [e, e])), 'Filtrer par détenteur', 'personne', false, actif.tit) +
      sel('pat-preuve', f['pat-preuve'], PREUVES_PAT, 'Filtrer par preuve', 'prouve', false, actif.preuve) +
      sel('pat-tri', f['pat-tri'], TRIS_PAT, 'Trier', 'tri') +
      '<label class="cherche">' + I('recherche', 16) + '<span class="sr">Chercher une ligne</span><input type="text" data-i="filtre" data-g="pat-cherche" data-cle="pat-cherche" placeholder="Chercher" value="' + ech(f['pat-cherche']) + '" autocomplete="off"></label></div>' : '');

  const classesVues = ORDRE_CLASSES.filter(c => P.some(p => p.classe === c));
  const legende = dimCle !== 'classe' && classesVues.length > 1 ? '<ul class="legende" aria-label="Couleurs des classes d’actifs">' + classesVues.map(c => '<li><span class="pastille-c" style="background:' + CLASSES[c].c + '"></span>' + CLASSES[c].court + '</li>').join('') + '</ul>' : '';
  const resume = '<div class="resume"><span>' + T.length + ' ' + (T.length > 1 ? dim.des : dim.un) + (filtre && avoirs ? ', ' + pct(total / avoirs * 100, 0) + ' des avoirs' : '') + '</span><b class="mnt">' + eur(total) + '</b></div>';
  const liste = T.length ? resume + legende + '<div class="rangs">' + T.map(g => rangVue(g, dimCle, total, max, L)).join('') + '</div>'
    : '<p class="vide">Aucune ligne ne correspond à cette vue.<br><button class="btn texte" data-a="effacer-filtres">Effacer les filtres</button></p>';

  /* Crédits */
  const creditsHtml = D.length ? '<div class="rangs">' + D.map(d => '<button class="rang libre" data-a="voir-credit" data-cle="rang-credit"><span class="ic terra">' + I('banque', 20) + '</span><span class="mil"><span class="t">Crédit immobilier</span><span class="s">Résidence principale, ' + pct(d.taux, 2) + ', fin ' + MOIS[decoupe(d.fin).m - 1] + ' ' + decoupe(d.fin).a + '</span></span><span class="fin"><span class="v mnt">' + eur(-d.restant) + '</span><span class="m">' + (d.part < 1 ? 'part de ' + pct(d.part * 100, 0) : eur(d.mensualite) + ' par mois') + '</span></span></button>').join('') + '</div>' : '<p class="vide">Aucun crédit dans ce périmètre.</p>';

  /* Évolution et performance : suivies pour toute la famille */
  const serie = serieNetPeriode();
  const evolution = famille
    ? '<div class="graphe" data-graphe="evolution"></div>' + tableValeurs('evolution', ['Date', 'Patrimoine net'], serie.map(p => [dateLongue(p.date), mnt(p.v)]))
    : '<p class="vide">L’historique est suivi pour toute la famille.<br><button class="btn texte" data-a="filtre" data-g="perimetre" data-v="famille">Voir toute la famille</button></p>';
  const perf = '<dl class="cv grand"><div><dt>Vos placements en 2026</dt><dd>+' + pct(FICTIF.performance.annee) + '</dd></div><div><dt>Par an, sur cinq ans</dt><dd>+' + pct(FICTIF.performance.cinqAns) + '</dd></div></dl>';

  const choixPerim = sel('perimetre', perim, PERIMETRES, 'Patrimoine affiché', 'personne', true) +
    (famille ? '' : info('Part ' + de(nomP) + ' : ses biens propres, la moitié des biens communs, et sa part de la société civile. Les parts données en nue-propriété sont partagées au barème fiscal entre usufruit et nue-propriété.'));
  return tete('Patrimoine', null, null, '<div class="tete-droite">' + choixPerim + '</div>') + kp +
    '<div class="grille c2 sous-kpis"><div class="col">' +
    '<section class="bloc" id="avoirs"><div class="bloc-tete"><h2>' + (famille ? 'Vos avoirs' : 'Avoirs ' + de(nomP)) +
    info('Une enveloppe est un compte ou un contrat : assurance vie, plan d’épargne en actions, compte-titres. Un support est ce qu’elle contient : un fonds, des espèces. Chaque enveloppe est comptée selon ce qu’elle contient réellement : une assurance vie investie en actions compte parmi les actions.') +
    '</h2><a class="btn doux petit-b" href="#mise-a-jour">' + I('maj', 16) + 'Mettre à jour</a></div>' + phrase + autres + liste +
    '<button class="btn plein large ajout" data-a="ajouter-avoir">' + I('plus', 18) + 'Ajouter un avoir ou un crédit</button></section>' +
    '</div><div class="col">' +
    bloc('Crédits', creditsHtml) +
    bloc('Évolution', (famille ? '<div class="periode">' + seg('pat-periode', f['pat-periode'], [['1', '1 an'], ['3', '3 ans'], ['5', '5 ans']], 'Période') + '</div>' : '') + evolution + (famille ? perf : ''), '',
      'Patrimoine net de la famille. Performance de vos placements financiers : nette de frais, avant impôt. Les performances passées ne préjugent pas des performances futures.') +
    '</div></div>';
}
/* Toucher un groupe, c'est regarder dedans : la classe, l'établissement, le détenteur ou la preuve devient le filtre,

ACTIONS.creuser = el => {

    const envs = Array.from(new Set(positionsVue(lignesPerim()).filter(p => p.nom === v && (f['pat-env'] === 'toutes' || p.env === f['pat-env'])).map(p => p.env)));
    if (envs.length === 1) { ACTIONS['voir-ligne']({ dataset: { id: envs[0] } }); return; }
    f['pat-support'] = v;
  } else f[{ classe: 'pat-classe', etab: 'pat-etab', titulaire: 'pat-tit', preuve: 'pat-preuve' }[g]] = v;
  f['pat-groupe'] = 'enveloppe';
  suiteFiltre();
  const m = $('[data-cle="sel-pat-groupe"]'); if (m) m.focus({ preventScroll: true });

function verdictRetraite(sim) {
  const e = sim.epuise;
  if (sim.besoin === 0) return 'Vos pensions estimées couvrent ce revenu : votre capital n’est pas entamé.';
  if (!e.bas) return 'Dans les trois hypothèses, votre capital financier finance ce revenu jusqu’à vos 90 ans.';
  if (!e.milieu) return 'Dans l’hypothèse intermédiaire, votre capital finance ce revenu jusqu’à vos 90 ans. Dans l’hypothèse défavorable, il serait épuisé à ' + e.bas + ' ans.';
  if (!e.haut) return 'Seule l’hypothèse favorable finance ce revenu jusqu’à vos 90 ans. Dans l’hypothèse intermédiaire, le capital serait épuisé à ' + e.milieu + ' ans.';
  return 'Dans les trois hypothèses, le capital serait épuisé avant vos 90 ans, dès ' + e.bas + ' ans dans l’hypothèse défavorable.';
}

/* ---------- Transmission ---------- */
function droitsLigneDirecte(base) {
  const T = [[8072, 0.05], [12109, 0.10], [15932, 0.15], [552324, 0.20], [902838, 0.30], [1805677, 0.40], [Infinity, 0.45]];
  let d = 0, prec = 0;
  for (let i = 0; i < T.length && base > prec; i++) { d += (Math.min(base, T[i][0]) - prec) * T[i][1]; prec = T[i][0]; }
  return d;
}
function tauxUsufruit(a) { return a < 21 ? 0.9 : a < 31 ? 0.8 : a < 41 ? 0.7 : a < 51 ? 0.6 : a < 61 ? 0.5 : a < 71 ? 0.4 : a < 81 ? 0.3 : a < 91 ? 0.2 : 0.1; }
function simulerSuccession() {
  const S = etat.succession, defunt = S.qui === 'etienne' ? 'Étienne' : 'Claire', survivant = S.qui === 'etienne' ? 'Claire' : 'Étienne';
  const ageSurvivant = age(membre(survivant).naissance), v = id => ligne(id).valeur;
  const rp = v('rp') * (S.abattementRP ? 0.8 : 1) - FICTIF.dettes[0].restant;
  /* Parts de la société civile détenues en pleine propriété par les parents : 60 %. Les 40 % donnés en nue-propriété n'entrent pas dans la succession. */
  const societe = v('locatif') * 0.6;
  const communs = v('pea') + v('cto') + v('livrets') + v('cat') + v('scpi') + v('fonds') + v('pret') + rp + societe;
  const part = communs / 2, u = tauxUsufruit(ageSurvivant);
  const recu = S.option === 'usufruit' ? part * (1 - u) / 2 : part * 0.75 / 2;
  const dejaDonne = abattementUtilise(defunt, 'Jules');
  const abattement = Math.max(0, FICTIF.dons.abattement - dejaDonne);
  const taxable = Math.max(0, recu - abattement), droits = Math.round(droitsLigneDirecte(taxable));
  return { defunt: defunt, survivant: survivant, ageSurvivant: ageSurvivant, dejaDonne: dejaDonne, communs: communs, part: part, usufruit: u, recu: recu, abattement: abattement, taxable: taxable, droits: droits };
}

    '<div class="jauge' + (complet ? '' : ' hachure') + '" role="img" aria-label="' + eur(utilise) + ' utilisés sur ' + eur(plafond) + '"><span style="width:' + (utilise / plafond * 100) + '%"></span></div>' +

}

  return tete('Investissements', phrase, null, '<button class="btn plein petit-b" data-a="demander-conseil">' + I('plus', 16) + 'Demander un conseil</button>') + kp +
    bloc('Recommandations de votre conseiller', recos, '', 'Chaque recommandation est préparée pour vous, puis relue, validée et signée par votre conseiller agréé. Fox Order conseille : vous décidez, et vous passez vous-même vos ordres.') +
    '<div class="grille c2"><div class="col">' +
    bloc('Votre répartition face à la cible', '<div style="margin-bottom:14px">' + seg('inv-effet', f['inv-effet'], [['non', 'Aujourd’hui'], ['oui', 'Après les recommandations']], 'Situation affichée') + '</div>' + allocHtml(), '',
      'Part de chaque classe dans vos placements financiers, selon ce que contiennent réellement vos enveloppes (les fonds en euros comptent parmi les obligations). La cible a été fixée avec votre conseiller le ' + dateLongue(V.profil.revue) + ' ; un écart de ' + V.tolerance + ' points est jugé normal.') +
    '</div><div class="col">' +
    bloc('La sélection Fox Order', gamme, '', 'Les supports que Fox Order suit pour ses clients. Cette liste n’est pas une recommandation : un support ne vous est conseillé qu’après étude de votre situation. Si un support verse une commission à Fox Order, elle vous est reversée en entier.') +

}

    '<span class="faits"><span>Risque ' + risqueHtml(g.risque) + ' <b>' + g.risque + ' sur 7</b></span><span>Durée conseillée <b>' + g.horizon + '</b></span></span></div>';

    '<section class="bloc" style="margin-top:12px"><div class="bloc-tete"><h2>À savoir avant de décider</h2></div><ul class="puces-c alerte">' + r.risques.map(x => '<li><span>' + x + '</span></li>').join('') + '<li><span>' + r.frais + '</span></li></ul>' +
    '<div class="rang-actions" style="margin-top:12px"><button class="btn contour petit-b" data-a="piece-reco" data-n="adequation">' + I('fichier', 16) + 'Déclaration d’adéquation</button><button class="btn contour petit-b" data-a="piece-reco" data-n="cles">' + I('fichier', 16) + 'Document d’informations clés</button></div></section>' +
    '<p class="petit" style="margin-top:12px">Validée et signée par votre conseiller agréé le ' + dateLongue(r.valide) + ', valable jusqu’au ' + dateLongue(r.limite) + '. Vous restez libre de la suivre ou non.</p>';
  const pied = st === 'alire' ? '<button class="btn contour" data-a="reco-decliner" data-id="' + r.id + '">Décliner</button><button class="btn contour" data-a="rdv">En parler</button><button class="btn plein" data-a="reco-accepter" data-id="' + r.id + '">J’accepte</button>'
    : st === 'acceptee' ? '<button class="btn contour" data-a="reco-rouvrir" data-id="' + r.id + '">Revenir sur ma décision</button><button class="btn plein" data-a="reco-passee" data-id="' + r.id + '">J’ai passé l’ordre</button>'
    : st === 'declinee' ? '<button class="btn contour" data-a="reco-rouvrir" data-id="' + r.id + '">Revenir sur ma décision</button><button class="btn plein" data-a="fermer">Fermer</button>'
    : '<button class="btn plein" data-a="fermer">Fermer</button>';
  ouvrirFeuille(r.titre, corps, pied);
};
function suiteReco(id, statut, message, rouvrir) {
  etat.reco[id] = statut;

  if (rouvrir) ACTIONS['voir-reco']({ dataset: { id: id } }); else dire(message);
}

function vueDocuments() {
  const D = FICTIF.documents, q = etat.recherche.trim().toLowerCase();
  const correspond = t => !q || t.toLowerCase().indexOf(q) >= 0;
  const signer = etat.lettreSignee
    ? '<div class="ligne"><span class="puce foret">' + I('check', 20) + '</span><span><span class="t">' + D.aSigner.titre + '</span><br><span class="s">Signée aujourd’hui. Un exemplaire est rangé dans votre dossier.</span></span><span class="fin">' + etatHtml('prouve', 'Signée') + '</span></div>'
    : '<button class="afaire" data-a="signer" data-cle="signer"><span class="puce terra">' + I('stylo', 20) + '</span><span><span class="t">' + D.aSigner.titre + '</span><br><span class="s">' + D.aSigner.detail + '. Reçue le ' + dateJourMois(D.aSigner.date) + '.</span></span><span class="chev">' + I('chevron-d', 20) + '</span></button>';
  const rapports = '<div class="liste">' + D.rapports.filter(r => correspond(r.titre)).map((r, i) => '<button class="ligne" data-a="apercu" data-t="' + ech(r.titre) + '" data-d="' + ech(r.detail) + '" data-cle="rap-' + i + '"><span class="puce">' + I('fichier', 20) + '</span><span><span class="t">' + r.titre + '</span><br><span class="s">' + r.detail + '</span></span><span class="fin"><span class="s">' + dateCourte(r.date) + '</span></span></button>').join('') + '</div>';
  const arbre = D.dossiers.map(d => {
    const sous = d.sous.map(s => ({ nom: s.nom, docs: s.docs.filter(x => correspond(x) || correspond(s.nom) || correspond(d.nom)) })).filter(s => s.docs.length);
    if (!sous.length) return '';
    const n = somme(sous, s => s.docs.length);
    return '<details class="dossier"' + (q ? ' open' : '') + '><summary>' + I('documents', 20) + d.nom + ' <span class="petit" style="font-weight:400">' + n + ' document' + (n > 1 ? 's' : '') + '</span><span class="chev">' + I('chevron-d', 18) + '</span></summary><div class="contenu">' +
      sous.map(s => '<h3 style="padding:12px 0 2px;font-size:13.5px;color:var(--encre-2);font-weight:500">' + s.nom + '</h3>' + s.docs.map(x => '<button class="ligne sans-icone" data-a="apercu" data-t="' + ech(x) + '" data-d="' + ech('Rangé dans ' + d.nom + ', ' + s.nom) + '"><span class="t" style="font-weight:400">' + x + '</span><span class="chev">' + I('chevron-d', 16) + '</span></button>').join('')).join('') + '</div></details>';
  }).join('');
  return tete('Documents', (etat.lettreSignee ? 'Tout est signé. ' : 'Un document attend votre signature. ') + 'Antoine a rangé ' + D.nouveaux + ' nouveaux documents ce mois-ci, chacun dans le dossier de son contrat.',
    '<button class="btn plein" data-a="deposer">' + I('deposer', 18) + 'Déposer un document</button><button class="btn contour" data-a="preparer-dossier">Préparer un dossier pour un professionnel</button>') +
    '<div class="recherche"><label class="sr" for="rech">Chercher un document</label>' + I('recherche', 20) + '<input id="rech" type="search" placeholder="Chercher un document" value="' + ech(etat.recherche) + '" data-i="recherche" data-cle="recherche"></div>' +
    (q ? '' : bloc('À signer', signer)) +
    bloc('Les rapports de Fox Order', rapports || '<p class="petit">Aucun rapport ne correspond.</p>') +
    bloc('Votre dossier', arbre || '<p class="petit">Aucun document ne correspond à « ' + ech(etat.recherche) + ' ».</p>', '', 'Classé par établissement, puis par contrat.');
}

function montrerDepot(fichiers) {
  const r = $('#depot-resultat'); if (!r) return;
  r.textContent = '';
  const intro = document.createElement('p'); intro.className = 'note';
  intro.textContent = typoTexte('Prototype : vos fichiers ne quittent pas votre appareil et ne sont pas lus. Voici ce que vous verriez après la lecture d’Antoine.');
  r.appendChild(intro);
  const liste = document.createElement('div'); liste.className = 'liste'; liste.style.marginTop = '12px';
  Array.from(fichiers).slice(0, 5).forEach(f => {
    const l = document.createElement('div'); l.className = 'ligne';
    l.innerHTML = '<span class="puce foret">' + I('check', 20) + '</span><span><span class="t"></span><br><span class="s">Reconnu comme un relevé de compte-titres d’octobre 2026. Rangé dans Banque du Parc, compte-titres. Il servira à votre prochaine mise à jour.</span></span>';
    l.querySelector('.t').textContent = f.name;
    liste.appendChild(l);
  });
  r.appendChild(liste);
}
ACTIONS['saisie-fichiers'] = el => { if (el.files && el.files.length) montrerDepot(el.files); };

/* ---------- Vos conseils ---------- */
function vueConseils() {
  const C = FICTIF.conseils;
  const equipe = '<div class="cartes c2">' +
    '<div class="carte"><div style="display:flex;gap:12px;align-items:center">' + avatarAntoine() + '<div><h3>Antoine</h3><p class="petit">Votre assistant numérique</p></div></div><p class="petit" style="margin-top:10px">Il répond à toute heure, lit vos documents et prépare les dossiers. Il informe et explique ; il ne recommande rien seul.</p><div class="rang-actions" style="margin-top:12px"><button class="btn contour" data-a="antoine">Poser une question</button></div></div>' +
    '<div class="carte"><div style="display:flex;gap:12px;align-items:center"><span class="personne">' + I('compte', 22) + '</span><div><h3>Votre conseiller agréé</h3><p class="petit">Il valide et signe chaque recommandation</p></div></div><p class="petit" style="margin-top:10px">' + (etat.rdv ? 'Rendez-vous confirmé : ' + ech(etat.rdv.charAt(0).toLowerCase() + etat.rdv.slice(1)) + '.' : 'Toute question de conseil lui est transmise ; il vous répond par écrit sous deux jours ouvrés.') + '</p><div class="rang-actions" style="margin-top:12px"><button class="btn contour" data-a="rdv">' + (etat.rdv ? 'Changer de créneau' : 'Prendre rendez-vous') + '</button></div></div></div>';
  const pros = '<div class="liste">' + C.professionnels.map(p => '<div class="ligne sans-icone"><span><span class="t">' + p.nom + '</span><br><span class="s">' + p.role + '. ' + p.dernier + '.' + (p.acces ? '<br>Accès à votre espace : ' + p.acces.toLowerCase() + ', jusqu’au ' + dateLongue(p.jusqua) + '.' : '') + '</span></span><span class="fin">' + (p.acces ? '<a class="btn texte" href="#famille" data-a="vers-acces">Gérer l’accès</a>' : '') + '</span></div>').join('') + '</div>' +
    '<div class="rang-actions" style="margin-top:16px"><button class="btn contour" data-a="preparer-dossier">Préparer un dossier pour l’un d’eux</button><button class="btn texte" data-a="inviter">Ajouter un professionnel</button></div>';
  const consultations = '<div class="liste">' + C.consultations.map(c => '<div class="ligne sans-icone"><span><span class="t">' + c.titre + '</span><br><span class="s">' + c.detail + '.</span>' +
    (c.attendues ? '<div class="jauge" style="margin-top:8px;max-width:260px" role="img" aria-label="' + c.recues + ' réponses sur ' + c.attendues + '"><span style="width:' + (c.recues / c.attendues * 100) + '%"></span></div>' : '') + '</span><span class="fin">' + etatHtml(c.etat, c.mot) + '</span></div>').join('') + '</div>';
  return tete('Vos conseils', 'Fox Order coordonne trois professionnels autour de votre famille. Une mise en concurrence est en cours pour votre assurance emprunteur.') +
    bloc('Votre équipe Fox Order', equipe) +
    bloc('Les professionnels qui vous entourent', pros, '', 'Fox Order prépare leurs dossiers et leur ouvre, avec votre accord, un accès limité à votre espace.') +
    bloc('Les mises en concurrence', consultations, '', 'Fox Order consulte plusieurs établissements pour vous et compare leurs réponses. Il n’est rémunéré par aucun d’eux.');
}
ACTIONS['vers-acces'] = () => { etat.onglet.famille = 'proches'; };
ACTIONS.rdv = () => {
  ouvrirFeuille('Prendre rendez-vous avec votre conseiller',
    '<p class="petit" style="margin-bottom:10px">Trente minutes, en visioconférence ou par téléphone. Choisissez un créneau.</p><div class="liste">' +
    FICTIF.conseils.creneaux.map((c, i) => '<button class="ligne sans-icone" data-a="rdv-choisi" data-n="' + i + '"><span class="t" style="font-weight:500">' + c + '</span><span class="chev">' + I('chevron-d', 18) + '</span></button>').join('') + '</div>');
};
ACTIONS['rdv-choisi'] = el => { etat.rdv = FICTIF.conseils.creneaux[Number(el.dataset.n)]; fermerFeuille(); rendre(); dire('Rendez-vous confirmé : ' + etat.rdv.charAt(0).toLowerCase() + etat.rdv.slice(1) + '.'); };

/* ---------- Mon compte ---------- */
function vueCompte() {
  const C = FICTIF.compte, P = C.profil;
  const inter = (id, actif, etiquette) => '<button class="interrupteur" role="switch" aria-checked="' + actif + '" aria-label="' + etiquette + '" data-a="bascule" data-id="' + id + '" data-cle="bascule-' + id + '"></button>';
  const securite = '<div class="liste">' +
    '<div class="ligne sans-icone"><span><span class="t">Mot de passe</span><br><span class="s">Modifié il y a trois mois</span></span><span class="fin"><button class="btn texte" data-a="mot-de-passe">Changer</button></span></div>' +
    '<div class="ligne sans-icone"><span><span class="t">Clé d’accès de votre téléphone</span><br><span class="s">Connexion par empreinte ou reconnaissance du visage, activée sur le téléphone de Claire</span></span><span class="fin">' + etatHtml('prouve', 'Activée') + '</span></div>' +
    '<div class="ligne sans-icone"><span><span class="t">Double vérification</span><br><span class="s">Un code à six chiffres, demandé en plus à chaque connexion. Facultatif.</span></span><span class="fin">' + inter('doubleAuth', etat.doubleAuth, 'Double vérification') + '</span></div></div>';
  const revue = etat.revueFaite
    ? '<p class="note garder">Votre revue annuelle est faite. Votre conseiller la confirme avec vous lors de votre prochain entretien.</p>'
    : '<div class="rang-actions" style="margin-top:14px"><button class="btn plein" data-a="revue">Commencer ma revue annuelle</button></div><p class="petit" style="margin-top:8px">À confirmer avant le ' + dateLongue(P.prochaine) + '. Cinq minutes : vous confirmez ou corrigez ce que nous savons de vous.</p>';
  const jaugeUsage = (titre, v) => '<div class="jauge-ligne"><div class="haut"><span>' + titre + '</span><span class="petit nb"><b style="color:var(--encre)">' + v + ' %</b> utilisés</span></div><div class="jauge neutre" role="img" aria-label="' + titre + ' : ' + v + ' % utilisés"><span style="width:' + v + '%"></span></div></div>';
  return tete('Mon compte', 'Claire Lambert, cliente de Fox Order depuis mars 2024.') +
    bloc('Vos coordonnées', '<dl class="cv large"><div><dt>Adresse électronique</dt><dd style="font-size:15px;overflow-wrap:anywhere">' + C.courriel + '</dd></div><div><dt>Téléphone</dt><dd style="font-size:15px">' + C.telephone + '</dd></div></dl>') +
    bloc('Sécurité', securite) +
    bloc('Votre profil d’investisseur', '<dl class="cv c4"><div><dt>Profil</dt><dd>' + P.risque + '</dd></div><div><dt>Horizon</dt><dd>' + P.horizon + '</dd></div><div><dt>Perte acceptée</dt><dd style="font-size:15px">' + P.perte + '</dd></div><div><dt>Dernière revue</dt><dd style="font-size:15px">' + dateLongue(P.revue) + '</dd></div></dl>' + revue,
      '', 'Établi avec vous et confirmé en entretien. Il encadre tout ce que Fox Order peut vous recommander.') +
    '<div class="deux">' +
    bloc('Vos échanges avec Antoine', jaugeUsage('Ce mois-ci', C.usage.mois) + jaugeUsage('Cette semaine', C.usage.semaine), '', 'Votre abonnement comprend un volume d’échanges. Ces jauges vous disent où vous en êtes.') +
    bloc('Votre abonnement', '<dl class="cv"><div><dt>Prochain prélèvement</dt><dd style="font-size:15px">' + mnt(C.abonnement.mensuel) + ' le ' + dateJourMois(C.abonnement.prochaine) + '</dd></div><div><dt>Mode de paiement</dt><dd style="font-size:15px">' + C.abonnement.mode + '</dd></div></dl><div class="rang-actions" style="margin-top:14px"><a class="btn contour" href="#frais">Voir ce que je paie</a></div>') +
    '</div>' +
    bloc('Affichage', '<div class="liste"><div class="ligne sans-icone"><span><span class="t">Masquer les montants</span><br><span class="s">Utile quand vous consultez votre espace en public</span></span><span class="fin">' + inter('discret', etat.discret, 'Masquer les montants') + '</span></div></div>') +
    bloc('Le cadre de notre relation', '<ul class="liste">' + [
      ['Conseil, jamais gestion', 'Vous décidez, vous signez et vous passez vos ordres. Fox Order ne détient jamais vos fonds.'],
      ['Aucune commission conservée', 'Toute rémunération reçue d’un fournisseur vous est reversée en totalité.'],
      ['Une personne valide chaque recommandation', 'Antoine prépare et explique ; votre conseiller agréé relit, valide et signe.'],
      ['Vos données restent en Europe', 'Elles ne servent qu’à votre suivi et ne sont jamais revendues.']
    ].map(x => '<li class="ligne"><span class="puce foret">' + I('check', 18) + '</span><span><span class="t">' + x[0] + '</span><br><span class="s">' + x[1] + '</span></span></li>').join('') + '</ul>') +
    bloc('Cette démonstration', '<p class="petit" style="max-width:46em">Vous utilisez un prototype : la famille Lambert et tous ses chiffres sont inventés, et rien de ce que vous faites n’est enregistré.</p><div class="rang-actions" style="margin-top:12px"><button class="btn contour" data-a="recommencer">Recommencer la démonstration</button><button class="btn texte" data-a="supprimer-compte">Supprimer mon compte</button></div>');
}
ACTIONS.bascule = el => {
  if (el.dataset.id === 'discret') { ACTIONS.discret(); return; }
  etat[el.dataset.id] = !etat[el.dataset.id];
  rendre(true);
  dire(etat.doubleAuth ? 'Double vérification activée.' : 'Double vérification désactivée.');
};
ACTIONS['mot-de-passe'] = () => {
  const champ = (id, texte) => '<div class="champ"><label for="' + id + '">' + texte + '</label><div class="avec-oeil"><input id="' + id + '" type="password" required minlength="12" autocomplete="off"><button type="button" data-a="voir-mdp" data-id="' + id + '" aria-label="Afficher ou masquer">' + I('oeil', 20) + '</button></div></div>';
  ouvrirFeuille('Changer de mot de passe',
    '<form class="formulaire" data-f="mdp">' + champ('mdp-ancien', 'Mot de passe actuel') + champ('mdp-nouveau', 'Nouveau mot de passe, 12 caractères au moins') + champ('mdp-encore', 'Le même, une seconde fois') +
    '<p class="petit" id="mdp-erreur" role="alert" style="color:var(--terracotta-texte)"></p>' +
    '<div class="f-pied" style="margin-top:4px"><button type="button" class="btn contour" data-a="fermer">Annuler</button><button class="btn plein">Changer le mot de passe</button></div></form>');
};
ACTIONS['voir-mdp'] = el => { const c = $('#' + el.dataset.id); c.type = c.type === 'password' ? 'text' : 'password'; el.innerHTML = I(c.type === 'password' ? 'oeil' : 'oeil-barre', 20); };
ACTIONS['envoi-mdp'] = f => {
  if ($('#mdp-nouveau', f).value !== $('#mdp-encore', f).value) { $('#mdp-erreur').textContent = 'Les deux saisies du nouveau mot de passe sont différentes. Retapez la seconde.'; return; }
  fermerFeuille(); dire('Dans ce prototype, le mot de passe n’est pas modifié.');
};
ACTIONS.recommencer = () => {
  const discret = etat.discret;
  Object.assign(etat, JSON.parse(ETAT_INITIAL), { discret: discret });
  Object.assign(FICTIF, JSON.parse(FICTIF_INITIAL));
  positionAntoine = null;
  if (location.hash !== '#accueil') location.hash = '#accueil'; else { rendre(); window.scrollTo(0, 0); }
  dire('La démonstration repart de zéro.');
};
ACTIONS['supprimer-compte'] = () => {
  ouvrirFeuille('Supprimer mon compte', '<p>Votre demande est transmise à votre conseiller. Il vous confirme la clôture, la restitution de vos documents et la durée pendant laquelle la loi impose de conserver certaines pièces.</p>',
    '<button class="btn contour" data-a="fermer">Annuler</button><button class="btn plein" data-a="supprimer-oui">Envoyer la demande</button>');
};
ACTIONS['supprimer-oui'] = () => { fermerFeuille(); dire('Dans ce prototype, aucune demande n’est envoyée.'); };

/* Revue annuelle guidée : quatre confirmations */
const REVUE = [
  ['Votre famille', 'Mariée à Étienne, deux enfants majeurs, Jules et Alice. Rien n’a changé ?'],
  ['Votre situation', 'Médecin en exercice libéral ; Étienne directeur industriel salarié. Revenus du foyer stables.'],
  ['Vos objectifs', 'Préparer la retraite d’Étienne, aider vos enfants à démarrer, transmettre dans de bonnes conditions. Horizon de huit ans.'],
  ['Vos documents', 'Votre carte d’identité expire le 22 mars 2027. Les autres pièces sont à jour.']
];
function feuilleRevue(n) {
  const e = REVUE[n];
  ouvrirFeuille('Revue annuelle, étape ' + (n + 1) + ' sur ' + REVUE.length,
    '<h3 style="font-family:var(--titre);font-size:19px;font-weight:500">' + e[0] + '</h3><p style="margin-top:8px">' + e[1] + '</p><p class="petit" style="margin-top:10px">Si quelque chose a changé, dites-le : votre conseiller reprendra ce point avec vous.</p>',
    '<button class="btn contour" data-a="revue-change" data-n="' + n + '">Quelque chose a changé</button><button class="btn plein" data-a="revue-suite" data-n="' + n + '">C’est toujours exact</button>');
}
ACTIONS.revue = () => feuilleRevue(0);
ACTIONS['revue-suite'] = el => {
  const n = Number(el.dataset.n) + 1;
  if (n < REVUE.length) feuilleRevue(n);
  else { etat.revueFaite = true; fermerFeuille(); rendre(); dire('Revue annuelle transmise à votre conseiller.'); }
};
ACTIONS['revue-change'] = ACTIONS['revue-suite'];

/* ---------- Antoine ---------- */
const QUESTIONS = [
  'Qu’est-ce qui a changé sur mon patrimoine en octobre ?',
  'Quand mes abattements de donation se reconstituent-ils ?',
  'Expliquez-moi l’usufruit et la nue-propriété.',
  'Je voudrais revoir ma clause bénéficiaire et parler du mandat de protection future.',
  'Faut-il vendre l’appartement loué ?',
  'Combien ai-je en actions, et dans quelles enveloppes ?',
  'Que contient mon assurance vie ?'
];
function reponseAntoine(i) {
  if (i === 0) {
    if (!majTerminee()) return { texte: 'Deux enveloppes ont un nouveau relevé pour octobre : votre plan d’épargne en actions passerait de ' + eur(314100) + ' à ' + eur(318400) + ', et votre compte-titres de ' + eur(206300) + ' à ' + eur(209600) + '. Ces valeurs attendent votre validation.', source: 'Vos relevés d’octobre 2026', action: ['mise-a-jour', 'Ouvrir la mise à jour'] };
    return { texte: 'Votre patrimoine net est de ' + eur(net()) + ' au 31 octobre, soit ' + eurSigne(net() - netAvantMaj()) + ' sur le mois. La hausse vient de vos fonds d’actions. Les autres enveloppes n’ont pas de nouveau relevé.', source: 'Vos relevés d’octobre 2026' };
  }
  if (i === 1) return { texte: 'Le 14 juin 2034, quinze ans après la donation-partage du 14 juin 2019. D’ici là, il reste ' + eur(FICTIF.dons.abattement - abattementUtilise('Claire', 'Jules')) + ' d’abattement entre chacun de vous deux et chacun de vos enfants.', source: 'Code général des impôts, articles 779 et 784 ; votre acte du 14 juin 2019', action: ['transmission', 'Voir vos donations'] };
  if (i === 2) return { texte: 'La propriété d’un bien peut se partager en deux. L’usufruit, c’est le droit de l’utiliser et d’en toucher les revenus. La nue-propriété, c’est le fait d’en être propriétaire sans pouvoir en profiter tout de suite. Dans votre société civile, Jules et Alice ont la nue-propriété de 40 % des parts ; Étienne et vous en gardez l’usufruit. À votre décès, ils en deviendront pleinement propriétaires.', source: 'Code civil, articles 578 et suivants' };
  /* Antoine donne le chiffre et dit où le retrouver : chaque vue du patrimoine a son adresse */
  if (i === 5) {
    const P = positions(lignes()).filter(p => p.classe === 'actions'), tot = somme(P, p => p.valeur), env = {};
    P.forEach(p => { env[p.enveloppe] = (env[p.enveloppe] || 0) + p.valeur; });
    const noms = Object.keys(env).sort((a, b) => env[b] - env[a]);
    return { texte: 'Votre famille détient ' + eur(tot) + ' en actions, soit ' + pct(tot / brut() * 100, 0) + ' de ses avoirs, dans ' + noms.length + ' enveloppes. La première est votre ' + minuscule(noms[0]) + ', avec ' + eur(env[noms[0]]) + '. Le détail est dans votre patrimoine.', source: 'Vos relevés au ' + dateLongue(dateReporting()), action: ['patrimoine-actions-par-enveloppe', 'Voir vos actions par enveloppe'] };
  }
  if (i === 6) {
    const l = ligne('av'), parts = {}; l.composition.forEach(c => { parts[c.classe] = (parts[c.classe] || 0) + c.valeur; });
    const ordre = Object.keys(parts).sort((a, b) => parts[b] - parts[a]);
    return { texte: 'Votre assurance vie Horizon vaut ' + eur(l.valeur) + ' : ' + ordre.map(c => pct(parts[c] / l.valeur * 100, 0) + ' en ' + minuscule(CLASSES[c].court)).join(', ') + '.', source: l.source, action: ['patrimoine-dans-assurance-vie-par-classe', 'Voir votre assurance vie par classe d’actifs'] };
  }
  return { texte: 'Cette question appelle un conseil personnalisé : je ne peux pas y répondre seul. Je prépare les éléments de votre dossier et je la transmets à votre conseiller, qui vous répondra par écrit sous deux jours ouvrés.', transmis: true };
}
function messageHtml(m) {
  if (m.de === 'v') return '<div class="msg v">' + ech(m.texte) + '</div>';
  return '<div class="msg a">' + m.texte + (m.source ? '<span class="source">Source : ' + m.source + '</span>' : '') +
    (m.transmis ? '<br>' + etatHtml('cours', 'Transmise à votre conseiller') : '') +
    (m.action ? '<br><a class="btn contour" href="#' + m.action[0] + '" data-a="antoine-fermer">' + m.action[1] + '</a>' : '') + '</div>';
}
function rendreAntoine() {
  const idees = [5, 6, 0, 1, 4];
  $('#antoine').innerHTML = typo('<section class="antoine" role="dialog" aria-label="Antoine, votre assistant">' +
    '<div class="a-tete">' + avatarAntoine() + '<div class="a-qui"><b>Antoine</b><small>Assistant numérique de Fox Order</small></div><button class="rond" data-a="antoine-fermer" aria-label="Fermer">' + I('fermer', 22) + '</button></div>' +
    '<div class="a-fil" id="a-fil" aria-live="polite">' + etat.fil.map(messageHtml).join('') + '</div>' +
    '<div class="a-idees">' + idees.map(i => '<button data-a="antoine-question" data-q="' + i + '">' + QUESTIONS[i] + '</button>').join('') + '</div>' +
    '<form class="a-saisie" data-f="antoine"><label class="sr" for="a-champ">Votre question</label><input id="a-champ" type="text" placeholder="Écrivez votre question" autocomplete="off"><button aria-label="Envoyer">' + I('envoyer', 20) + '</button></form>' +
    '<p class="a-cadre">Antoine informe et explique. Toute recommandation vous est adressée par écrit, après validation par votre conseiller agréé.</p></section>');
  const fil = $('#a-fil'); fil.scrollTop = fil.scrollHeight;
  brancherDeplacement();
}
function ouvrirAntoine() {
  taire();
  if (!etat.fil.length) etat.fil.push({ de: 'a', texte: 'Bonjour Claire. Je connais votre dossier et je peux vous expliquer un chiffre, une règle ou un document. Que souhaitez-vous savoir ?' });
  rendreAntoine();
  if (window.innerWidth < 1020) document.body.style.overflow = 'hidden';
  $('#a-champ').focus({ preventScroll: true });
}
function fermerAntoine() { $('#antoine').innerHTML = ''; document.body.style.overflow = ''; }
function poserQuestion(i) {
  etat.fil.push({ de: 'v', texte: QUESTIONS[i] });
  const r = reponseAntoine(i);
  etat.fil.push(Object.assign({ de: 'a' }, r));
  rendreAntoine();
}
ACTIONS.antoine = () => { if ($('.feuille')) fermerFeuille(); ouvrirAntoine(); };
ACTIONS['antoine-fermer'] = () => fermerAntoine();
ACTIONS['antoine-question'] = el => { if (!$('#antoine').innerHTML) ouvrirAntoine(); poserQuestion(Number(el.dataset.q)); };
ACTIONS['envoi-antoine'] = () => {
  const c = $('#a-champ'), t = c.value.trim();
  if (!t) return;
  etat.fil.push({ de: 'v', texte: t });
  etat.fil.push({ de: 'a', texte: 'Dans ce prototype, je ne réponds qu’aux questions proposées sous cette conversation. Relié au serveur, je répondrai à vos propres questions, sources à l’appui.' });
  rendreAntoine();
  $('#a-champ').focus({ preventScroll: true });
};
/* Sur ordinateur, la fenêtre d'Antoine se déplace en la tenant par son bandeau */
let positionAntoine = null;
function brancherDeplacement() {
  const boite = $('.antoine'), poignee = $('.antoine .a-tete');
  if (!boite || window.innerWidth < 1020) return;
  if (positionAntoine) { boite.style.left = positionAntoine.x + 'px'; boite.style.top = positionAntoine.y + 'px'; boite.style.right = 'auto'; boite.style.bottom = 'auto'; }
  poignee.addEventListener('pointerdown', ev => {
    if (ev.target.closest('button')) return;
    const r = boite.getBoundingClientRect(), dx = ev.clientX - r.left, dy = ev.clientY - r.top;
    poignee.setPointerCapture(ev.pointerId);
    const bouge = e => {
      const x = Math.max(8, Math.min(window.innerWidth - r.width - 8, e.clientX - dx)), y = Math.max(8, Math.min(window.innerHeight - 80, e.clientY - dy));
      positionAntoine = { x: x, y: y };
      boite.style.left = x + 'px'; boite.style.top = y + 'px'; boite.style.right = 'auto'; boite.style.bottom = 'auto';
    };
    const fin = () => { poignee.removeEventListener('pointermove', bouge); poignee.removeEventListener('pointerup', fin); };
    poignee.addEventListener('pointermove', bouge);
    poignee.addEventListener('pointerup', fin);
  });
}

/* ---------- Démarrage ---------- */
const ETAT_INITIAL = JSON.stringify(etat);
const FICTIF_INITIAL = JSON.stringify(FICTIF);
appliquerAdresse();
rendre();

</script>

/* ==========================================================================
   Fox Order — Espace client, prototype « nouvelle ergonomie »
   Charte « Bohème » (18/11/2026) : vert forêt dominant, sable, terracotta ; Bricolage Grotesque et Figtree.
   Mise en page : rail anthracite fixe à gauche sur ordinateur, barre basse au
   pouce sur téléphone ; une colonne de lecture alignée à gauche ; chaque écran
   s'ouvre sur un verdict en une phrase, le détail vient ensuite.
   ========================================================================== */
:root{
  color-scheme: light;
  --sable:#FBF7EF;            /* crème : le texte posé sur le vert */
  --surface:#FFFFFF;          /* objets sur lesquels on agit */
  --pierre-1:#E9DDC8;         /* dune : le sable en surface (pastilles, dates, filtres) */
  --pierre-2:#EAE2D3;         /* filets */
  --pierre-3:#D8CCB6;         /* dune soutenue : survol */
  --bord-champ:#857A68;       /* contour des champs de saisie (lisible : 3,7 sur le sable) */
  --encre:#2C2A28;            /* texte */
  --encre-2:#57524A;          /* texte secondaire */
  --encre-3:#655F56;          /* texte estompé (lisible aussi sur la dune et l'argile) */
  --foret:#2E4B45;            /* couleur principale */
  --foret-fort:#263F3A;
  --foret-doux:#DFE9E2;            /* brume */
  --terracotta:#B2553B;       /* ce qui vous attend, ce que la famille doit */
  --terracotta-texte:#8A3D26;
  --terracotta-doux:#F2D8C9;      /* argile */
  --ocre-plein:#D9A441;       /* appoint */
  --sauge:#A9BFAF;            /* appoint */
  --soleil:#DC7A52;           /* la valeur du jour, au bout de la courbe */
  --ocre:#7A5A0E;             /* état « à confirmer » */
  --ocre-doux:#F5EBCF;
  --rail:#2C2A28;
  --rail-texte:#EDE7DA;
  --rail-estompe:#A8A196;
  /* graphiques : palette vérifiée par calcul (écarts daltoniens et vision normale) */
  --c-actions:#1E7C50;
  --c-oblig:#CB9D2A;
  --c-immo:#B85637;
  --c-noncote:#714085;
  --c-liq:#0698A4;
  --titre:'Bricolage Grotesque Variable','Figtree Variable',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sans:'Figtree Variable',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --r:22px;
  --r-s:14px;
  --arche:50% 50% 28% 28%/50% 50% 28% 28%;
  --rail-l:252px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--sable);color:var(--encre);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:var(--foret);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--foret-fort)}
img,svg{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--foret);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.passer{position:absolute;left:8px;top:-60px;background:var(--foret);color:var(--sable);padding:10px 14px;border-radius:var(--r-s);z-index:100}
.passer:focus{top:8px}

/* ---------- Typographie ---------- */
.point{font-family:var(--titre);font-weight:400;font-size:25px;line-height:1.28;letter-spacing:-.012em;text-wrap:pretty;max-width:27em}
h1.titre{font-family:var(--titre);font-weight:500;font-size:26px;line-height:1.2;letter-spacing:-.005em}
.verdict{font-family:var(--titre);font-size:18px;line-height:1.45;max-width:38em;color:var(--encre);margin-top:10px;text-wrap:pretty}
h2{font-family:var(--titre);font-weight:500;font-size:20px;line-height:1.25;text-wrap:balance}
h3{font-size:15px;font-weight:600;line-height:1.35}
.petit{font-size:13px;line-height:1.45;color:var(--encre-2)}
.estompe{color:var(--encre-3)}
.nb{font-variant-numeric:tabular-nums}
strong,b{font-weight:600}
.mnt{font-variant-numeric:tabular-nums;white-space:nowrap;word-spacing:-.06em}
body.discret .mnt{filter:blur(7px);user-select:none}
body.discret .mnt-g text{filter:blur(5px)}

/* ---------- Structure générale ---------- */
.rail{display:none}
.barre-haut{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;background:var(--sable);border-bottom:1px solid var(--pierre-2);padding:calc(8px + env(safe-area-inset-top)) 12px 8px 16px}
.barre-haut .marque{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none;color:var(--encre)}
.barre-haut .marque img{width:32px;height:32px;border-radius:9px}
.barre-haut .marque span{font-family:var(--titre);font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rond{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--encre-2)}
.rond:hover{background:var(--pierre-1);color:var(--encre)}
.rond[aria-pressed="true"]{background:var(--foret-doux);color:var(--foret)}
main{padding:22px 16px calc(104px + env(safe-area-inset-bottom));max-width:1080px}
main:focus{outline:none}
.outils{display:none}

.barre-bas{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--pierre-2);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.barre-bas a,.barre-bas button{display:grid;justify-items:center;gap:2px;min-height:50px;padding:4px 2px;font-size:11.5px;line-height:1.2;color:var(--encre-3);text-decoration:none;border-radius:var(--r-s)}
.barre-bas [aria-current="page"]{color:var(--foret);font-weight:600}
.barre-bas .depot{color:var(--foret);font-weight:600}
.barre-bas .depot .pastille{display:grid;place-items:center;width:46px;height:46px;margin-top:-20px;border-radius:50%;background:var(--foret);color:var(--sable);border:3px solid var(--surface)}

@media (min-width:1020px){
  .barre-haut,.barre-bas{display:none}
  .rail{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:var(--rail-l);background:var(--rail);color:var(--rail-texte);padding:22px 14px 16px}
  main{margin-left:var(--rail-l);padding:28px 56px 96px}
  .outils{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
  .point{font-size:32px}
  h1.titre{font-size:31px}
  .verdict{font-size:20px}
  h2{font-size:22px}
}

/* ---------- Rail (ordinateur) ---------- */
.rail .marque{display:flex;align-items:center;gap:12px;padding:2px 8px 18px;text-decoration:none;color:var(--rail-texte)}
.rail .marque img{width:40px;height:40px;border-radius:11px}
.rail .marque b{display:block;font-family:var(--titre);font-weight:500;font-size:20px;line-height:1.1}
.rail .marque small{display:block;font-size:12.5px;color:var(--rail-estompe);margin-top:2px}
.rail nav{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(249,246,240,.25) transparent}
.rail .groupe{font-size:12.5px;color:var(--rail-estompe);padding:13px 10px 4px}
.rail nav a{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:8px;color:var(--rail-texte);text-decoration:none;font-size:14.5px}
.rail nav a svg{color:var(--rail-estompe);flex:none}
.rail nav a:hover{background:rgba(249,246,240,.07)}
.rail nav a[aria-current="page"]{background:rgba(249,246,240,.13);font-weight:600}
.rail nav a[aria-current="page"] svg{color:#E3A48C}
.rail nav a .compte{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#A44F37;color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.rail .pied{flex:none;padding:14px 0 0;font-size:12.5px;line-height:1.45;color:var(--rail-estompe)}
.rail .pied p{padding:12px 10px 0}
.rail-antoine{display:flex;align-items:center;gap:11px;width:100%;padding:7px 12px 7px 7px;border-radius:12px;background:rgba(249,246,240,.09);border:1px solid rgba(249,246,240,.16);color:var(--rail-texte);text-align:left}
.rail-antoine:hover{background:rgba(249,246,240,.15)}
.rail-antoine img{width:38px;height:38px;border-radius:50%;flex:none}
.rail-antoine b{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
.rail-antoine small{display:block;font-size:12.5px;color:var(--rail-estompe);line-height:1.3}
/* Le rail se resserre quand l'écran est bas, pour que les treize rubriques et Antoine restent visibles sans défiler :
   confortable au-delà de 890 px de haut, resserré jusqu'à 730 px, puis les titres de groupe deviennent de simples filets. */
@media (min-width:1020px) and (max-height:889px){
  .rail{padding:16px 14px 12px}
  .rail .marque{padding-bottom:12px}
  .rail .groupe{padding:10px 10px 3px}
  .rail nav a{padding:5px 10px;line-height:1.4}
  .rail .pied{padding-top:12px}
  .rail .pied p{display:none}
}
@media (min-width:1020px) and (max-height:729px){
  .rail .groupe{font-size:0;line-height:0;height:1px;padding:0;margin:6px 10px;background:rgba(249,246,240,.14)}
}
.rail :focus-visible{outline-color:#E3A48C}

/* ---------- En-tête de page ---------- */
.tete{display:grid;gap:4px;margin-bottom:26px}
.tete .jour{font-size:13.5px;color:var(--encre-3)}
.tete .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.bloc{margin-top:36px}
.bloc > .bloc-tete{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.bloc > .bloc-tete + .petit{margin-bottom:10px;max-width:46em}
.bloc-tete a,.lien{font-size:14px;font-weight:500}
.deux{display:grid;gap:36px 48px}
@media (min-width:1020px){.deux{grid-template-columns:1fr 1fr}.bloc{margin-top:44px}}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent;white-space:nowrap}
.btn.plein{background:var(--foret);color:var(--sable)}
.btn.plein:hover{background:var(--foret-fort);color:var(--sable)}
.btn.contour{border-color:var(--pierre-3);color:var(--encre);background:var(--surface)}
.btn.contour:hover{border-color:var(--encre-3)}
.btn.texte{padding:0 6px;color:var(--foret);font-weight:600}
.btn.texte:hover{text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.large{width:100%}
/* Petits téléphones : un libellé long passe sur deux lignes plutôt que de sortir de l'écran */
@media (max-width:359px){.btn{white-space:normal;max-width:100%;padding:8px 14px;text-align:left;line-height:1.3}.btn.plein,.btn.contour{justify-content:flex-start}}
@media (min-width:640px){.btn.large{width:auto}}

/* ---------- Onglets ---------- */
.onglets{position:relative;display:flex;gap:4px;overflow-x:auto;margin:0 -16px 22px;padding:0 16px;border-bottom:1px solid var(--pierre-2);scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.onglets button{flex:none;min-height:44px;padding:0 12px;font-size:14.5px;color:var(--encre-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.onglets button[aria-selected="true"]{color:var(--encre);font-weight:600;border-bottom-color:var(--terracotta)}
@media (min-width:1020px){.onglets{margin:0 0 26px;padding:0}}

/* ---------- Listes et lignes ---------- */
.liste{border-top:1px solid var(--pierre-2)}
.ligne{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 14px;padding:13px 0;border-bottom:1px solid var(--pierre-2);width:100%;text-decoration:none;color:inherit}
.ligne.sans-icone{grid-template-columns:minmax(0,1fr) auto}
button.ligne:hover,a.ligne:hover{background:linear-gradient(var(--pierre-1),var(--pierre-1)) no-repeat;background-size:calc(100% + 16px) 100%;background-position:-8px 0}
.ligne .t{font-weight:600;line-height:1.35}
.ligne .s{font-size:13px;color:var(--encre-2);line-height:1.4;margin-top:1px}
.ligne .fin{display:grid;justify-items:end;gap:2px;text-align:right}
.ligne .fin .mnt{font-weight:600}
.ligne .chev{color:var(--encre-3)}
.puce{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--pierre-1);color:var(--encre-2);flex:none}
.puce.foret{background:var(--foret-doux);color:var(--foret)}
.puce.terra{background:var(--terracotta-doux);color:var(--terracotta-texte)}
.puce.ocre{background:var(--ocre-doux);color:var(--ocre)}
.pastille-c{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.detail{grid-column:1/-1;padding:4px 0 6px}
.detail table{width:100%;border-collapse:collapse;font-size:14px}
.detail td,.detail th{padding:7px 0;border-top:1px solid var(--pierre-2);text-align:left;font-weight:400;vertical-align:top}
.detail td:last-child,.detail th:last-child{text-align:right}
.detail th{font-size:12.5px;color:var(--encre-3);border-top:0}

/* ---------- États ---------- */
.etat{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;line-height:1;padding:4px 8px 4px 6px;border-radius:20px;font-weight:500;white-space:nowrap}
.etat svg{flex:none}
.etat.prouve{background:var(--foret-doux);color:var(--foret)}
.etat.declare{background:transparent;color:var(--encre-2);box-shadow:inset 0 0 0 1px var(--pierre-3)}
.etat.avoir{background:var(--ocre-doux);color:var(--ocre)}
.etat.cours{background:var(--pierre-1);color:var(--encre-2)}
.etat.fait{background:transparent;color:var(--encre-3);padding-left:0}
.etat.vous{background:var(--terracotta-doux);color:var(--terracotta-texte)}

/* ---------- Cartes ---------- */
.carte{background:var(--surface);border:1px solid var(--pierre-2);border-radius:var(--r);padding:16px}
.carte.calme{background:var(--pierre-1);border-color:transparent}
.cartes{display:grid;gap:12px}
@media (min-width:760px){.cartes.c2{grid-template-columns:1fr 1fr}.cartes.c3{grid-template-columns:repeat(3,1fr)}}
.afaire{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--pierre-2);border-radius:var(--r);padding:14px 14px 14px 12px;text-decoration:none;color:inherit}
.afaire:hover{border-color:var(--pierre-3)}
.afaire .t{font-weight:600}
.afaire .s{font-size:13.5px;color:var(--encre-2);margin-top:1px}
.afaire .chev{color:var(--encre-3)}
.cv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.cv.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
.cv.large{grid-template-columns:minmax(0,1fr)}
@media (min-width:520px){.cv.large{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:760px){.cv.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.cv.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cv dt{font-size:13px;color:var(--encre-2)}
.cv dd{font-weight:600;font-size:16px;margin-top:1px}
.note{font-size:13.5px;line-height:1.5;color:var(--encre-2);background:var(--pierre-1);border-radius:var(--r);padding:12px 14px;max-width:52em}
.note.terra{background:var(--terracotta-doux);color:var(--encre)}
.note b{color:var(--encre)}

/* ---------- Accueil : patrimoine net ---------- */
.net{display:grid;gap:22px;padding:22px 0 24px;border-top:1px solid var(--pierre-2);border-bottom:1px solid var(--pierre-2)}
.net .libelle{font-size:13.5px;color:var(--encre-2)}
.hero{display:block;font-size:clamp(40px,10.5vw,54px);font-weight:600;line-height:1.05;letter-spacing:-.02em;word-spacing:-.12em;font-variant-numeric:normal;margin:4px 0 6px}
.delta{font-size:14px;color:var(--encre-2)}
.preuves{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
@media (min-width:1020px){.net{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:48px;align-items:end;padding:28px 0 30px}}

/* ---------- Barre de répartition (strates) ---------- */
.strates{display:flex;gap:2px;height:14px;border-radius:5px;overflow:hidden}
.strates span{display:block;min-width:3px}
.strates.haute{height:28px;border-radius:6px}
.legende{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--encre-2)}
.legende li{display:flex;align-items:center;gap:6px}
.legende b{color:var(--encre);font-weight:600}

/* ---------- Jauges ---------- */
.jauge{height:8px;border-radius:4px;background:var(--foret-doux);overflow:hidden}
.jauge > span{display:block;height:100%;border-radius:4px;background:var(--foret)}
.jauge.neutre{background:var(--pierre-2)}
.jauge.neutre > span{background:var(--encre-2)}
.jauge.hachure{background:repeating-linear-gradient(135deg,var(--pierre-2) 0 6px,var(--pierre-1) 6px 12px)}
.jauge.hachure > span{background:repeating-linear-gradient(135deg,var(--encre-3) 0 6px,#8F897E 6px 12px)}
.jauge-ligne{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--pierre-2)}
.jauge-ligne .haut{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.barres{display:grid;gap:10px}
.barres .b{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.barres .b .piste{grid-column:1/-1;height:10px}
.barres .b .piste span{display:block;height:100%;background:var(--foret);border-radius:0 4px 4px 0;min-width:2px}

/* ---------- Échéances ---------- */
.echeance{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px solid var(--pierre-2);align-items:start}
.echeance .quand{font-size:12.5px;line-height:1.2;color:var(--encre-2);text-align:center;padding-top:2px}
.echeance .quand b{display:block;font-family:var(--titre);font-size:22px;font-weight:500;color:var(--encre);line-height:1}
.echeance .t{font-weight:600;line-height:1.35}
.echeance .s{font-size:13.5px;color:var(--encre-2);margin-top:1px}

/* ---------- Étapes ---------- */
.etapes{display:flex;gap:6px;margin:0 0 22px;counter-reset:e}
.etapes li{flex:1;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--encre-3);padding-top:10px;border-top:3px solid var(--pierre-2)}
.etapes li::before{counter-increment:e;content:counter(e);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pierre-2);color:var(--encre-2);font-size:12.5px;font-weight:600;flex:none}
.etapes li.actuelle{color:var(--encre);font-weight:600;border-top-color:var(--terracotta)}
.etapes li.actuelle::before{background:var(--terracotta);color:#fff}
.etapes li.faite{border-top-color:var(--foret);color:var(--encre-2)}
.etapes li.faite::before{background:var(--foret);color:var(--sable);content:"✓"}

/* ---------- Verdicts de mise à jour ---------- */
.verdict-carte{background:var(--surface);border:1px solid var(--pierre-2);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.verdict-carte .haut{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.verdict-carte .total{font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.verdict-carte .question{background:var(--ocre-doux);border-radius:8px;padding:12px 14px;display:grid;gap:10px}
.verdict-carte .question .choix{display:flex;flex-wrap:wrap;gap:8px}
.verdict-carte.grise{background:transparent;border-style:dashed;color:var(--encre-2)}
.coche{width:22px;height:22px;accent-color:var(--foret);margin:2px 0 0;flex:none}
.tout-cocher{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--encre-2);min-height:44px}
.collecte .ligne .s .tourne{display:inline-block;animation:tourne 1s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}

/* ---------- Graphiques ---------- */
.graphe{position:relative}
.graphe svg{width:100%;height:auto;overflow:visible;touch-action:pan-y}
.graphe .axe text{font-size:12px;fill:var(--encre-3);font-family:var(--sans)}
.graphe .valeur-fin{font-size:12.5px;font-weight:600;fill:var(--encre);font-family:var(--sans)}
.bulle{position:absolute;top:0;left:0;pointer-events:none;background:var(--encre);color:var(--sable);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.35;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5}
.bulle.vue{opacity:1}
.bulle b{display:block;font-size:14.5px}
.bulle i{display:inline-block;width:12px;height:2px;margin-right:6px;vertical-align:middle;font-style:normal}
.bascule{font-size:13.5px;color:var(--foret);font-weight:500;min-height:36px}
.bascule:hover{text-decoration:underline;text-underline-offset:3px}
.valeurs{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.valeurs td,.valeurs th{padding:7px 0;border-top:1px solid var(--pierre-2);text-align:left;font-weight:400}
.valeurs td:last-child,.valeurs th:last-child{text-align:right}
.valeurs th{font-size:12.5px;color:var(--encre-3)}

/* ---------- Formulaires ---------- */
.champ{display:grid;gap:6px}
.champ label,.champ .lab{font-size:14px;font-weight:500}
.champ input[type=text],.champ input[type=email],.champ input[type=number],.champ input[type=password],.champ select,.champ textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--pierre-3);border-radius:8px;background:var(--surface)}
.champ textarea{min-height:92px;resize:vertical}
.champ .aide{font-size:13px;color:var(--encre-2)}
.formulaire{display:grid;gap:16px}
.cases{display:grid;gap:2px}
.cases label{display:flex;align-items:center;gap:10px;min-height:40px;font-weight:400;font-size:14.5px}
.cases input{width:20px;height:20px;accent-color:var(--foret)}
.avec-oeil{position:relative}
.avec-oeil input{padding-right:48px!important}
.avec-oeil button{position:absolute;right:2px;top:0;width:44px;height:44px;display:grid;place-items:center;color:var(--encre-2)}
input[type=range]{width:100%;accent-color:var(--foret);height:32px}
.curseur{display:grid;gap:2px}
.curseur .haut{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.curseur output{font-weight:600;font-size:16px}
.interrupteur{position:relative;display:inline-flex;align-items:center;width:46px;height:28px;border-radius:14px;background:var(--pierre-3);transition:background .15s;flex:none}
.interrupteur::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.interrupteur[aria-checked="true"]{background:var(--foret)}
.interrupteur[aria-checked="true"]::after{transform:translateX(18px)}
.depot-zone{display:grid;justify-items:center;gap:8px;text-align:center;border:1.5px dashed var(--pierre-3);border-radius:var(--r);padding:26px 16px;background:var(--surface);color:var(--encre-2);cursor:pointer}
.depot-zone:hover,.depot-zone.survol{border-color:var(--foret);background:var(--foret-doux)}
.depot-zone b{color:var(--encre);font-size:15.5px}

/* ---------- Feuilles (fenêtres) ---------- */
.voile{position:fixed;inset:0;z-index:50;background:rgba(44,42,40,.42);display:grid;align-items:end;justify-items:center}
.feuille{width:100%;max-width:580px;max-height:90vh;max-height:90dvh;overflow-y:auto;background:var(--sable);border-radius:16px 16px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:monte .22s ease-out}
.feuille .poignee{width:40px;height:4px;border-radius:2px;background:var(--pierre-3);margin:4px auto 10px}
.feuille .f-tete{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.feuille .f-tete h2{font-size:21px;padding-top:8px}
.feuille .f-pied{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.feuille .f-pied .btn{flex:1}
@keyframes monte{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:760px){
  .voile{align-items:center}
  .feuille{border-radius:14px;padding:14px 26px 26px;max-height:86vh}
  .feuille .poignee{display:none}
  .feuille .f-pied .btn{flex:none}
  .feuille .f-pied{justify-content:flex-end}
}
.menu-groupes{display:grid;gap:18px}
.menu-groupes h3{font-size:13px;font-weight:500;color:var(--encre-3);margin-bottom:4px}
.menu-groupes a{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 4px;border-bottom:1px solid var(--pierre-2);text-decoration:none;color:var(--encre);font-weight:500}
.menu-groupes a svg{color:var(--encre-2)}
.menu-groupes a[aria-current="page"]{color:var(--foret);font-weight:600}
.menu-groupes a .compte{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--terracotta-texte);color:#fff;font-size:12.5px;font-weight:600;display:grid;place-items:center}

/* ---------- Message bref ---------- */
.message{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:80;max-width:min(92vw,460px);background:var(--encre);color:var(--sable);padding:11px 16px;border-radius:10px;font-size:14.5px;line-height:1.4;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.message.vu{opacity:1;transform:translate(-50%,0)}
@media (min-width:1020px){.message{bottom:32px;left:calc(50% + var(--rail-l)/2)}}

/* ---------- Antoine ---------- */
.antoine{position:fixed;z-index:60;inset:0;display:flex;flex-direction:column;background:var(--sable)}
.antoine .a-tete{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px 16px;border-bottom:1px solid var(--pierre-2);background:var(--surface)}
.antoine .a-tete img{width:40px;height:40px;border-radius:50%}
.antoine .a-tete b{display:block;font-family:var(--titre);font-size:18px;font-weight:500;line-height:1.1}
.antoine .a-tete small{font-size:12.5px;color:var(--encre-2)}
.antoine .a-fil{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.5}
.msg.a{background:var(--surface);border:1px solid var(--pierre-2);border-bottom-left-radius:4px;align-self:flex-start}
.msg.v{background:var(--foret);color:var(--sable);border-bottom-right-radius:4px;align-self:flex-end}
.msg .source{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--pierre-2);font-size:12.5px;color:var(--encre-2)}
.msg .etat{margin-top:8px}
.msg .btn{margin-top:10px;min-height:38px;font-size:14px}
.a-idees{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.a-idees::-webkit-scrollbar{display:none}
.a-idees button{flex:none;max-width:260px;text-align:left;font-size:13.5px;line-height:1.35;padding:9px 12px;border:1px solid var(--pierre-3);border-radius:12px;background:var(--surface)}
.a-idees button:hover{border-color:var(--foret)}
.a-saisie{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--pierre-2);background:var(--surface)}
.a-saisie input{flex:1;min-height:44px;border:1px solid var(--pierre-3);border-radius:22px;padding:0 16px;background:var(--sable);min-width:0}
.a-saisie button{width:44px;height:44px;border-radius:50%;background:var(--foret);color:var(--sable);display:grid;place-items:center;flex:none}
.a-cadre{font-size:12px;line-height:1.4;color:var(--encre-3);padding:0 16px 8px;background:var(--surface)}
@media (min-width:1020px){
  .antoine{inset:auto 28px 26px auto;width:392px;height:min(620px,calc(100vh - 60px));border:1px solid var(--pierre-3);border-radius:16px;overflow:hidden;box-shadow:0 14px 44px rgba(44,42,40,.18)}
  .antoine .a-tete{cursor:grab;padding-top:10px;touch-action:none}
  .antoine .a-tete:active{cursor:grabbing}
}

/* ---------- Famille ---------- */
.personne{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--foret-doux);color:var(--foret);font-weight:600;font-size:15px;flex:none}
.personne.moi{background:var(--foret);color:var(--sable)}
.personne.petit-rond{width:30px;height:30px;font-size:12.5px}
.arbre{display:grid;justify-items:center;gap:0;padding:8px 0 4px}
.arbre .rang{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.arbre .noeud{display:grid;justify-items:center;gap:6px;width:112px;text-align:center;font-size:13.5px;line-height:1.3}
.arbre .noeud b{font-size:14.5px}
.arbre .trait{width:1px;height:22px;background:var(--pierre-3)}
.arbre .union{align-self:center;width:28px;height:1px;background:var(--pierre-3);margin-top:-46px}
.arbre .fourche{width:126px;height:14px;border:1px solid var(--pierre-3);border-bottom:0;border-radius:8px 8px 0 0}
.groupe-avatars{display:flex}
.groupe-avatars .personne{margin-left:-8px;border:2px solid var(--surface)}
.groupe-avatars .personne:first-child{margin-left:0}

/* ---------- Divers ---------- */
.pied-page{margin-top:56px;padding-top:16px;border-top:1px solid var(--pierre-2);font-size:12.5px;line-height:1.5;color:var(--encre-3);max-width:60em}
.rang-actions{display:flex;flex-wrap:wrap;gap:10px}
.raccourcis{display:grid;gap:10px}
@media (min-width:760px){.raccourcis{grid-template-columns:repeat(3,1fr)}}
.raccourci{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:1px solid var(--pierre-2);border-radius:var(--r);background:var(--surface);font-weight:500;text-decoration:none;color:var(--encre);width:100%}
.raccourci:hover{border-color:var(--pierre-3)}
.raccourci svg{color:var(--foret);flex:none}
.recherche{position:relative;max-width:460px}
.recherche svg{position:absolute;left:12px;top:12px;color:var(--encre-3)}
.recherche input{width:100%;min-height:44px;padding:0 14px 0 40px;border:1px solid var(--pierre-3);border-radius:22px;background:var(--surface)}
.dossier > summary{display:flex;align-items:center;gap:12px;min-height:50px;cursor:pointer;list-style:none;border-bottom:1px solid var(--pierre-2);font-weight:600}
.dossier > summary::-webkit-details-marker{display:none}
.dossier > summary .chev{margin-left:auto;color:var(--encre-3);transition:transform .15s}
.dossier[open] > summary .chev{transform:rotate(90deg)}
.dossier .contenu{padding-left:14px;margin-left:18px;border-left:1px solid var(--pierre-2)}
.dossier .contenu .ligne{padding:10px 0}
.resultat{display:grid;gap:4px;padding:16px;background:var(--surface);border:1px solid var(--pierre-2);border-radius:var(--r)}
.resultat .grand{font-size:30px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.code6{letter-spacing:.4em;font-size:22px!important;text-align:center;font-weight:600}
.liste-num{counter-reset:n;display:grid;gap:0}
.liste-num > li{counter-increment:n;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:11px 0;border-bottom:1px solid var(--pierre-2)}
.liste-num > li::before{content:counter(n) ".";font-family:var(--titre);font-size:18px;color:var(--encre-3);line-height:1.3}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media print{
  .rail,.barre-haut,.barre-bas,.outils{display:none!important}
  main{margin:0;padding:0}
}

/* ==========================================================================
   Version 2 — « cartes douces » : l'essentiel d'un coup d'œil.
   Cette feuille vient après la première et la corrige.
   Principes : une carte par sujet ; un chiffre lisible avant toute phrase ;
   les explications dans une bulle ou un volet replié ; des filtres et des tris
   partout où il y a une liste.
   ========================================================================== */
:root{
  --fond:#F4EFE6;
  --pierre-0:#F7F2E9;
  --filet:rgba(44,42,40,.09);
  --r-l:30px;
  --ombre:0 0 0 0 transparent;                 /* plus d'ombre sous les cartes : les surfaces se distinguent par leur teinte */
  --ombre-haute:0 2px 6px rgba(44,42,40,.06),0 14px 32px -12px rgba(44,42,40,.38);
  --rail:var(--fond);
  --rail-texte:var(--encre);
  --rail-estompe:var(--encre-3);
}
body{background:var(--fond)}

/* ---------- Chiffres : séparateurs de milliers nets, largeurs régulières ---------- */
.mnt,.nb{font-variant-numeric:tabular-nums lining-nums;font-kerning:none}
.mnt{word-spacing:.03em}
.hero{font-size:clamp(38px,10vw,50px);font-weight:650;letter-spacing:-.022em;word-spacing:.05em;font-kerning:none;font-variant-numeric:lining-nums;margin:6px 0 8px}

/* ---------- Titres ---------- */
h1.titre{font-size:26px}
h2{font-family:var(--sans);font-weight:650;font-size:16px;line-height:1.3;letter-spacing:-.005em}
.verdict{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--encre-2);max-width:46em;margin-top:2px}
.tete{margin-bottom:16px;gap:6px}
.tete .rangee{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tete .actions{margin-top:10px}
@media (min-width:1020px){h1.titre{font-size:30px}h2{font-size:17px}.verdict{font-size:15.5px}}

/* ---------- Cartes ---------- */
.bloc{margin-top:14px;background:var(--surface);border:1px solid var(--filet);border-radius:var(--r);padding:16px 16px 18px;box-shadow:var(--ombre);min-width:0}
.bloc > .bloc-tete{align-items:center;margin-bottom:12px;flex-wrap:nowrap}
.bloc > .bloc-tete h2{display:flex;align-items:center;gap:4px;min-width:0}
.bloc > .bloc-tete a,.bloc > .bloc-tete .lien{white-space:nowrap}
.bloc .carte{background:var(--pierre-0);border-color:transparent;box-shadow:none}
.bloc .resultat{background:var(--pierre-0);border-color:transparent}
.carte{border-color:var(--filet);border-radius:var(--r);box-shadow:var(--ombre)}
.carte.calme{box-shadow:none}
.afaire,.raccourci,.verdict-carte,.resultat{border-color:var(--filet);border-radius:var(--r)}
.deux{gap:14px}
.grille{display:grid;gap:14px}
.grille > .bloc,.grille .col > .bloc,.deux > .bloc{margin-top:0}
.col{display:grid;gap:14px;align-content:start;min-width:0}
@media (min-width:1020px){
  .bloc{margin-top:16px;padding:20px 22px 22px}
  .deux,.grille,.col{gap:16px}
  .grille.c2{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}
}
.liste{border-top:0}
.ligne,.jauge-ligne,.echeance,.liste-num > li{border-bottom-color:var(--filet)}
.liste > :last-child,.liste > :last-child > .ligne{border-bottom:0}
.detail td,.detail th,.valeurs td,.valeurs th{border-top-color:var(--filet)}
.ligne .s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{border-radius:12px;background:var(--pierre-0)}

/* ---------- Boutons ---------- */
.btn{border-radius:12px}
.btn.petit-b{min-height:36px;padding:0 13px;font-size:14px;border-radius:18px}
.btn.contour{border-color:var(--filet);box-shadow:0 1px 2px rgba(44,42,40,.05)}
.btn.contour:hover{border-color:var(--pierre-3)}
.btn.doux{background:var(--foret-doux);color:var(--foret)}
.btn.doux:hover{background:#D7E3DC}

/* ---------- Onglets en pastilles ---------- */
.onglets{border-bottom:0;gap:8px;margin-bottom:14px;padding-top:2px;padding-bottom:2px}
.onglets button{min-height:38px;padding:0 15px;border-radius:19px;background:var(--surface);border:1px solid var(--filet);color:var(--encre-2);margin:0}
.onglets button[aria-selected="true"]{background:var(--foret);border-color:var(--foret);color:var(--sable);font-weight:600}

/* ---------- Pastilles de filtre, listes déroulantes, bascules ---------- */
.commandes{display:grid;gap:10px;margin-bottom:6px}
.commandes .rangee{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--filet);background:var(--surface);font-size:14px;color:var(--encre-2);white-space:nowrap}
.chip:hover{border-color:var(--pierre-3)}
.chip[aria-pressed="true"]{background:var(--foret);border-color:var(--foret);color:var(--sable);font-weight:600}
.chip .pastille-c{width:9px;height:9px;border-radius:50%}
.chip .n{font-size:12.5px;opacity:.72;font-weight:500}
@media (min-width:1020px){.chips{margin:0 -22px;padding:2px 22px;flex-wrap:wrap;overflow:visible}}
.sel{position:relative;display:inline-flex;align-items:center;max-width:100%}
.sel > svg:first-child{position:absolute;left:11px;pointer-events:none;color:var(--encre-3)}
.sel > svg:last-child{position:absolute;right:10px;pointer-events:none;color:var(--encre-3)}
.sel select{appearance:none;-webkit-appearance:none;min-height:36px;padding:0 32px 0 34px;border-radius:18px;border:1px solid var(--filet);background:var(--surface);font-size:14px;color:var(--encre);max-width:100%;text-overflow:ellipsis;cursor:pointer}
.sel select:hover{border-color:var(--pierre-3)}
.sel.fort select{background:var(--foret-doux);border-color:transparent;color:var(--foret);font-weight:600}
.sel.fort > svg{color:var(--foret)}
.seg{display:inline-flex;background:var(--pierre-1);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:34px;padding:0 12px;border-radius:9px;font-size:13.5px;color:var(--encre-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--encre);font-weight:600;box-shadow:0 1px 2px rgba(44,42,40,.14)}
.cherche{position:relative;flex:1 1 180px;min-width:0}
.cherche svg{position:absolute;left:12px;top:9px;color:var(--encre-3)}
.cherche input{width:100%;min-height:36px;padding:0 12px 0 36px;border-radius:18px;border:1px solid var(--filet);background:var(--surface);font-size:14px}

/* ---------- Bulles d'explication ---------- */
.i-btn{position:relative;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:var(--encre-3);flex:none;vertical-align:middle}
.i-btn::after{content:"";position:absolute;inset:-11px}
.i-btn:hover,.i-btn[aria-expanded="true"]{color:var(--foret);background:var(--foret-doux)}
.sur-fonce .i-btn{color:rgba(249,246,240,.75)}
.sur-fonce .i-btn:hover,.sur-fonce .i-btn[aria-expanded="true"]{color:var(--sable);background:rgba(249,246,240,.16)}
.i-pop{position:fixed;z-index:90;left:0;top:0;width:max-content;max-width:min(300px,calc(100vw - 24px));background:var(--encre);color:var(--sable);border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.45;box-shadow:var(--ombre-haute);opacity:0;pointer-events:none;transition:opacity .12s}
.i-pop.vue{opacity:1;pointer-events:auto}

/* ---------- Volets repliés ---------- */
details.plus{margin-top:10px}
details.plus > summary{display:inline-flex;align-items:center;gap:8px;min-height:36px;font-size:13.5px;font-weight:500;color:var(--foret);cursor:pointer;list-style:none}
details.plus > summary::-webkit-details-marker{display:none}
details.plus > summary::after{content:"";width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
details.plus[open] > summary::after{transform:rotate(-135deg);margin-top:3px}
details.plus > .note{margin-top:4px !important}

/* ---------- Tuiles de chiffres clés ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpis.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--filet);border-radius:var(--r);padding:13px 14px;box-shadow:var(--ombre);display:grid;gap:2px;min-width:0;align-content:start;text-align:left;text-decoration:none;color:inherit}
.kpi .k{font-size:12.5px;color:var(--encre-3);display:flex;align-items:center;gap:4px;min-height:22px}
.kpi .v{font-size:19px;font-weight:650;letter-spacing:-.012em;line-height:1.2;white-space:nowrap}
.kpi .d{font-size:12.5px;color:var(--encre-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.fort{background:var(--foret);border-color:var(--foret);color:var(--sable)}
.kpi.fort .k,.kpi.fort .d{color:rgba(249,246,240,.8)}
@media (max-width:379px){.kpi .v{font-size:17px}}
@media (min-width:1020px){.kpi{padding:15px 18px}.kpi .v{font-size:22px}}

/* ---------- Carte du patrimoine net (accueil) ---------- */
.hero-c{position:relative;overflow:hidden;background:var(--foret);color:var(--sable);border-radius:var(--r-l);padding:18px 18px 16px;box-shadow:var(--ombre)}
.hero-c::before{content:"";position:absolute;right:-90px;top:-120px;width:300px;height:300px;border-radius:50%;background:radial-gradient(closest-side,rgba(249,246,240,.13),rgba(249,246,240,0))}
.hero-c > *{position:relative}
.hero-c .k{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:rgba(249,246,240,.82)}
.hero-c .hero{color:var(--sable)}
.hero-c a{color:var(--sable)}
.pastille{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:0 10px;border-radius:13px;font-size:12.5px;font-weight:500;background:rgba(249,246,240,.15);color:var(--sable);white-space:nowrap}
.pastille.claire{background:var(--foret-doux);color:var(--foret)}
.pastille.terra{background:var(--terracotta-doux);color:var(--terracotta-texte)}
.pastille.ocre{background:var(--ocre-doux);color:var(--ocre)}
.pastille.neutre{background:var(--pierre-1);color:var(--encre-2)}
.etincelle{display:block;width:100%;height:64px;margin:10px 0 12px}
.preuve-b{display:grid;gap:7px}
.preuve-b .piste{display:flex;gap:3px;height:8px}
.preuve-b .piste span{display:block;border-radius:4px;min-width:6px}
.preuve-b .piste .p{background:var(--sable)}
.preuve-b .piste .d{background:repeating-linear-gradient(135deg,rgba(249,246,240,.5) 0 4px,rgba(249,246,240,.22) 4px 8px)}
.preuve-b .leg-p{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:rgba(249,246,240,.86)}
.preuve-b .leg-p b{color:var(--sable);font-weight:600}
@media (min-width:1020px){.hero-c{padding:24px 26px 22px}.etincelle{height:84px}}

/* ---------- Rangées de liste (v2) ---------- */
.rangs{display:grid}
.rang{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--filet);width:100%;text-align:left;color:inherit;text-decoration:none;min-width:0}
.rangs > .rang:last-child,.rangs > :last-child > .rang{border-bottom:0}
.rang.sans-ic{grid-template-columns:minmax(0,1fr) auto}
.rang .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--pierre-1);color:var(--encre-2);flex:none}
.rang .ic.foret{background:var(--foret-doux);color:var(--foret)}
.rang .ic.terra{background:var(--terracotta-doux);color:var(--terracotta-texte)}
.rang .ic.ocre{background:var(--ocre-doux);color:var(--ocre)}
.rang .ic.classe{background:color-mix(in srgb,var(--cc) 14%,#fff);color:var(--cc)}
.rang .mil{min-width:0;display:grid;gap:1px}
.rang .t{font-weight:600;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rang .s{font-size:13px;color:var(--encre-3);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rang .fin{display:grid;justify-items:end;gap:1px;text-align:right}
.rang .fin .v{font-weight:650;font-size:15px;white-space:nowrap}
.rang .fin .m{font-size:12.5px;color:var(--encre-3);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.rang .chev{color:var(--pierre-3)}
button.rang:hover,a.rang:hover{background:linear-gradient(var(--pierre-0),var(--pierre-0)) no-repeat;background-size:calc(100% + 20px) 100%;background-position:-10px 0}
.groupe-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 0 2px;font-size:12.5px;font-weight:600;color:var(--encre-3)}
.groupe-t:first-child{padding-top:4px}
.point-p{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--foret);flex:none}
.point-p.d{background:transparent;box-shadow:inset 0 0 0 1.5px var(--encre-3)}
.mini-strates{display:flex;gap:2px;height:4px;border-radius:2px;overflow:hidden;margin-top:5px;max-width:160px}
.mini-strates span{display:block;min-width:2px}
.vide{padding:22px 8px;text-align:center;color:var(--encre-3);font-size:14px}
.compteur{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:#A44F37;color:#fff;font-size:12.5px;font-weight:600;margin-left:6px}
.compteur.calme{background:var(--pierre-1);color:var(--encre-2)}

/* ---------- Anneau de répartition ---------- */
.anneau{display:grid;gap:14px;align-items:center}
.anneau .dessin{position:relative;width:min(100%,190px);margin:0 auto}
.anneau .dessin svg{width:100%;height:auto;overflow:visible}
.anneau .dessin .centre{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;padding:0 34px}
.anneau .dessin .centre b{font-size:17px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.anneau .dessin .centre span{font-size:12px;color:var(--encre-3);line-height:1.3}
.anneau path{cursor:pointer;transition:opacity .12s}
.anneau.filtre path:not(.choisi){opacity:.28}
.leg{display:grid}
.leg button,.leg .l{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--filet);width:100%;font-size:14px;text-align:left}
.leg > :last-child{border-bottom:0}
.leg .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.leg .pc{color:var(--encre-3);font-size:13px;min-width:42px;text-align:right}
.leg .va{font-weight:600;min-width:92px;text-align:right}
.leg button:hover .nom{text-decoration:underline;text-underline-offset:3px}
.leg button[aria-pressed="true"] .nom{font-weight:650;color:var(--foret)}
.leg .pastille-c{width:10px;height:10px;border-radius:50%}
.anneau-c{container-type:inline-size}
@container (min-width:470px){.anneau{grid-template-columns:170px minmax(0,1fr);gap:22px}}

/* ---------- Échéances compactes ---------- */
.date-b{display:grid;place-items:center;align-content:center;width:44px;height:46px;border-radius:12px;background:var(--pierre-1);line-height:1;flex:none}
.date-b b{font-size:16px;font-weight:650}
.date-b small{font-size:11px;color:var(--encre-3);margin-top:3px}

/* ---------- Gestes rapides ---------- */
.gestes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.geste{display:grid;justify-items:center;gap:7px;padding:12px 4px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--filet);box-shadow:var(--ombre);font-size:12.5px;line-height:1.25;text-align:center;color:var(--encre);text-decoration:none;min-width:0}
.geste .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--foret-doux);color:var(--foret)}
.geste:hover{border-color:var(--pierre-3)}

/* ---------- Investissements ---------- */
.reco{display:grid;gap:10px;background:var(--surface);border:1px solid var(--filet);border-radius:var(--r);padding:16px;box-shadow:var(--ombre);text-align:left;width:100%;color:inherit}
.reco:hover{border-color:var(--pierre-3)}
.reco .haut{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.reco .t{font-weight:650;font-size:15.5px;line-height:1.3}
.reco .montant{font-size:22px;font-weight:650;letter-spacing:-.012em;line-height:1.15}
.reco .mouv{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--encre-2);flex-wrap:wrap}
.reco .mouv .de,.reco .mouv .vers{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:9px;background:var(--pierre-0)}
.faits{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--encre-2)}
.faits > span{display:inline-flex;align-items:center;gap:6px}
.faits b{color:var(--encre);font-weight:600}
.risque{display:inline-flex;gap:3px;align-items:center}
.risque i{width:7px;height:7px;border-radius:50%;background:var(--pierre-2)}
.risque i.o{background:var(--encre)}
.alloc{display:grid;gap:14px}
.alloc .r{display:grid;gap:7px}
.alloc .h{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.alloc .h .nom{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.alloc .h .ch{display:flex;align-items:center;gap:8px;white-space:nowrap}
.alloc .piste{position:relative;height:10px;border-radius:5px;background:var(--pierre-1)}
.alloc .piste .a{position:absolute;inset:0 auto 0 0;border-radius:5px;min-width:3px}
.alloc .piste .c{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--encre);box-shadow:0 0 0 2px var(--surface)}
.alloc-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--encre-3);margin-top:12px}
.alloc-leg span{display:inline-flex;align-items:center;gap:6px}
.alloc-leg .a{width:16px;height:8px;border-radius:4px;background:var(--encre-3)}
.alloc-leg .c{width:3px;height:14px;border-radius:2px;background:var(--encre)}
.etapes-v{counter-reset:ev;display:grid;gap:0}
.etapes-v li{counter-increment:ev;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:9px 0;font-size:14.5px;line-height:1.45}
.etapes-v li::before{content:counter(ev);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--foret-doux);color:var(--foret);font-size:12.5px;font-weight:650}
.avant-apres{display:grid;gap:8px}
.avant-apres .l{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;font-size:14px}
.avant-apres .fl{color:var(--encre-3)}
.puces-c{display:grid;gap:8px}
.puces-c li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:14.5px;line-height:1.45}
.puces-c li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--foret);margin:8px 0 0 5px}
.puces-c.alerte li::before{background:var(--terracotta)}

/* ---------- Rail clair (ordinateur) ---------- */
@media (min-width:1020px){
  .rail{background:var(--rail);color:var(--encre);border-right:1px solid var(--filet)}
  main{padding:22px 40px 80px}
  .outils{margin-bottom:2px;align-items:center}
}
.rail .marque{color:var(--encre)}
.rail .marque small,.rail .groupe{color:var(--encre-3)}
.rail nav{scrollbar-color:var(--pierre-3) transparent}
.rail nav a{color:var(--encre-2);border-radius:10px}
.rail nav a svg{color:var(--encre-3)}
.rail nav a:hover{background:var(--pierre-1)}
.rail nav a[aria-current="page"]{background:var(--foret-doux);color:var(--foret);font-weight:600}
.rail nav a[aria-current="page"] svg{color:var(--foret)}
.rail .pied{color:var(--encre-3)}
.rail-antoine{background:var(--surface);border:1px solid var(--filet);color:var(--encre);box-shadow:var(--ombre)}
.rail-antoine:hover{background:var(--surface);border-color:var(--pierre-3)}
.rail-antoine small{color:var(--encre-3)}
.rail :focus-visible{outline-color:var(--terracotta)}
@media (min-width:1020px) and (max-height:729px){.rail .groupe{background:var(--filet)}}

/* ---------- Téléphone : barres flottantes ---------- */
.barre-haut{background:color-mix(in srgb,var(--fond) 88%,transparent);backdrop-filter:saturate(1.3) blur(12px);-webkit-backdrop-filter:saturate(1.3) blur(12px);border-bottom:0}
.barre-bas{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));border:1px solid var(--filet);border-radius:24px;box-shadow:var(--ombre-haute);padding:6px;background:rgba(255,255,255,.95);backdrop-filter:saturate(1.3) blur(14px);-webkit-backdrop-filter:saturate(1.3) blur(14px)}
.barre-bas a,.barre-bas button{border-radius:16px;min-height:48px}
.barre-bas .depot .pastille{box-shadow:0 6px 16px -6px rgba(46,75,69,.6)}
main{padding:14px 16px calc(116px + env(safe-area-inset-bottom))}
.message{bottom:calc(96px + env(safe-area-inset-bottom));border-radius:14px}
@media (min-width:1020px){.message{bottom:32px}}

/* ---------- Fenêtres ---------- */
.feuille{border-radius:22px 22px 0 0;background:var(--fond)}
.feuille .f-corps .carte,.feuille .bloc{background:var(--surface)}
@media (min-width:760px){.feuille{border-radius:20px}}
.f-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.f-kpis .kpi{box-shadow:none}
.pied-page{margin-top:28px;border-top:0;padding-top:0}
.rang.libre .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.commandes .rangee.defile{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.commandes .rangee.defile::-webkit-scrollbar{display:none}
.commandes .rangee.defile > *{flex:none}
.commandes .rangee.defile .cherche{display:none}
@media (min-width:1020px){
  .commandes .rangee.defile{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
  .commandes .rangee.defile .cherche{display:block;flex:1 1 150px}
}
.f-kpis .kpi .v{white-space:normal;overflow-wrap:anywhere;font-size:17px;line-height:1.25}
.f-kpis .kpi .d{white-space:normal}
/* Listes posées à même la page (rubriques pas encore refaites) : elles prennent l'allure d'une carte */
#contenu > .liste,#contenu > .collecte > .liste,#contenu > div > .liste:only-child{background:var(--surface);border:1px solid var(--filet);border-radius:var(--r);padding:2px 16px;box-shadow:var(--ombre)}
/* Téléphones : un libellé de bouton trop long passe sur deux lignes plutôt que de sortir de sa carte */
@media (max-width:419px){.btn{white-space:normal;max-width:100%;line-height:1.3;padding-top:8px;padding-bottom:8px}}
.bloc + .grille,.kpis + .grille,.kpis + .bloc,.grille + .bloc,.tete + .grille{margin-top:14px}
@media (min-width:1020px){.bloc + .grille,.kpis + .grille,.kpis + .bloc,.grille + .bloc{margin-top:16px}}
.bloc + .deux,.deux + .bloc,.deux + .deux,.onglets + .deux{margin-top:14px}
@media (min-width:1020px){.bloc + .deux,.deux + .bloc,.deux + .deux{margin-top:16px}}
@media (max-width:479px){.btn .lib-large{display:none}.btn.petit-b:has(.lib-large){padding:0 10px}}
@media (max-width:359px){.geste{font-size:11.5px;padding-left:2px;padding-right:2px}.geste .ic{width:36px;height:36px}}

/* ==========================================================================
   Version 3 — charte « Bohème » (validée le 18/11/2026).
   Cette feuille vient après les deux premières et en change l'allure :
   vert forêt = ce que la famille possède ; terracotta = ce qui vous attend
   et ce que la famille doit ; sable = le fond et les surfaces calmes.
   Formes : l'arche (dessins, dates), la pilule (boutons, menus), le soleil
   (la valeur du jour). Plus de traits gris ni d'ombres sous les cartes.
   Règles tenues partout : aucune commande hors de l'écran (tout passe à la
   ligne), cibles de 44 points, champs à 16 points, explications en bulle.
   ========================================================================== */
body{font-size:16px}
::selection{background:var(--terracotta-doux);color:var(--encre)}
.sur-fonce ::selection,.kpi.fort ::selection,.msg.v::selection{background:var(--sable);color:var(--foret)}
input,select,textarea{caret-color:var(--terracotta);accent-color:var(--foret)}
.sur-fonce :focus-visible,.kpi.fort :focus-visible{outline-color:var(--sable)}
a{text-decoration-thickness:1.5px;text-underline-offset:4px}

/* ---------- Titres et grands montants : Bricolage Grotesque ---------- */
h1.titre,h2,.hero,.kpi .v,.reco .montant,.resultat .grand,.verdict-carte .total,.date-b b,.echeance .quand b,.resume b{font-family:var(--titre);font-optical-sizing:auto}
h1.titre{font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.025em;text-wrap:balance}
h2{font-weight:700;font-size:19px;line-height:1.2;letter-spacing:-.015em}
h3{font-size:16px;font-weight:650}
.verdict{font-family:var(--sans);font-size:16px;line-height:1.45;color:var(--encre-2);margin-top:4px}
.hero{font-weight:700;font-size:clamp(34px,11.6vw,46px);letter-spacing:-.02em;word-spacing:.04em;font-kerning:auto;line-height:1.05;margin:8px 0 12px}
/* séparateurs de milliers : une espace nette, jamais resserrée */
.mnt{word-spacing:.02em}
.petit{font-size:14px}
@media (min-width:1020px){h1.titre{font-size:34px}h2{font-size:20px}.verdict{font-size:16.5px}}

/* ---------- Cartes : des surfaces, sans trait ni ombre ---------- */
.bloc{border:0;border-radius:26px;padding:20px 20px 14px}
.bloc > .bloc-tete{margin-bottom:10px;min-height:36px}
.bloc > .bloc-tete a,.bloc > .bloc-tete .lien{font-size:15px;font-weight:650;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:flex-end}
.carte,.afaire,.raccourci,.verdict-carte,.resultat,.reco{border-color:transparent}
.note{border-radius:16px;font-size:14.5px}
.kpi{border:0;border-radius:22px;padding:14px 16px}
.kpi .k{font-size:14px;color:var(--encre-2);min-height:24px}
.kpi .v{font-weight:700;font-size:22px;letter-spacing:-.015em}
.kpi .d{font-size:13.5px}
.kpi.fort .k,.kpi.fort .d{color:#D6DFD8}
/* ce que la famille doit : la terracotta en aplat doux */
.kpi.du{background:var(--terracotta-doux)}
.kpi.du .v{color:var(--terracotta-texte)}
.cv.grand{margin-top:14px}
.cv.grand dt{font-size:14px}
.cv.grand dd{font-family:var(--titre);font-weight:700;font-size:22px;letter-spacing:-.015em}
.tete-droite{display:flex;align-items:center;gap:6px;min-width:0}
.grille.sous-kpis{margin-top:14px}
.periode{margin-bottom:8px}
.bloc .ajout{margin:14px 0 6px;min-height:52px;width:100%}
.leg a.l{text-decoration:none;color:inherit}
@media (max-width:379px){.kpi .v{font-size:19px}}
@media (min-width:1020px){.bloc{padding:24px 26px 20px}.kpi{padding:16px 20px}.kpi .v{font-size:24px}}
/* ce qui vous attend : un bloc en argile */
.bloc.attend{background:var(--terracotta-doux)}
.bloc.attend .rang{border-bottom-color:rgba(138,61,38,.18)}
.bloc.attend .rang .ic{background:var(--surface);color:var(--terracotta-texte)}
.bloc.attend .rang .chev{color:var(--terracotta-texte)}
.bloc.attend .vide{color:var(--encre-2)}

/* ---------- La carte du patrimoine : la courbe en paysage, la valeur du jour en soleil ---------- */
.hero-c{border-radius:var(--r-l);padding:22px 22px 20px}
.hero-c::before{display:none}
.hero-c .k{font-size:15px;color:#D6DFD8}
.hero-c .k a{font-size:15px;font-weight:650;min-height:44px;display:inline-flex;align-items:center;margin-left:auto}
.hero-c .pastille{background:var(--pierre-1);color:var(--foret)}
.etincelle{height:96px;margin:6px 0 4px}
.etincelle svg{overflow:visible}
.etincelle .trace{fill:none;stroke:var(--sable);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.etincelle .soleil{fill:var(--soleil);stroke:var(--sable);stroke-width:3.5}
.etincelle .h{stop-color:var(--foret-doux);stop-opacity:.34}
.etincelle .b{stop-color:var(--foret-doux);stop-opacity:0}
.graphe .h{stop-color:var(--foret);stop-opacity:.18}
.graphe .b{stop-color:var(--foret);stop-opacity:0}
.preuve-b .piste{height:10px}
.preuve-b .piste span{border-radius:999px}
.preuve-b .piste .d{background:repeating-linear-gradient(135deg,rgba(251,247,239,.55) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1.5px rgba(251,247,239,.55)}
.preuve-b .leg-p{font-size:14px;color:#D6DFD8}
@media (prefers-reduced-motion:no-preference){
  .entree .etincelle .trace{stroke-dasharray:1;animation:bo-trace 1.1s cubic-bezier(.16,1,.3,1) both}
  .entree .etincelle .aire{animation:bo-fondu .9s .3s cubic-bezier(.16,1,.3,1) both}
  .entree .etincelle .soleil{transform-box:fill-box;transform-origin:center;animation:bo-soleil .55s .8s cubic-bezier(.16,1,.3,1) both}
}
@keyframes bo-trace{from{stroke-dashoffset:1}}
@keyframes bo-fondu{from{opacity:0}}
@keyframes bo-soleil{from{transform:scale(.2);opacity:0}}
@media (min-width:1020px){.hero-c{padding:26px 28px 24px}.etincelle{height:112px}}

/* ---------- Pastilles et états ---------- */
.pastille{min-height:30px;padding:0 12px;border-radius:999px;font-size:13.5px;font-weight:600}
/* un état long passe sur deux lignes plutôt que de pousser sa carte hors de l'écran */
.etat{font-size:13.5px;font-weight:600;line-height:1.25;padding:4px 10px 4px 8px;border-radius:14px;border:1.5px solid transparent;white-space:normal;text-align:left}
.etat.declare{box-shadow:none;border:1.5px dashed var(--bord-champ)}
.etat.fait{padding-left:0}
.compteur{min-width:26px;height:26px;border-radius:999px;background:var(--terracotta);font-size:14px;font-weight:700}
.compteur.calme{background:var(--foret-doux);color:var(--foret)}

/* ---------- Boutons : des pilules ---------- */
.btn{border:0;border-radius:999px;padding:0 20px;font-size:15.5px;font-weight:650}
.btn.petit-b{min-height:44px;padding:0 16px;font-size:15px;border-radius:999px}
.btn.contour{background:var(--pierre-1);border:0;box-shadow:none}
.btn.contour:hover{background:var(--pierre-3)}
.btn.doux:hover{background:#D2E0D7}
.btn.texte{padding:0 4px;border-radius:10px;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.btn .lib-large{display:inline}
/* posé à même le sable (en-têtes, fenêtres, barre d'outils), un bouton calme est blanc */
.tete .btn.contour,.outils .btn.contour,.feuille .btn.contour,.rang-actions .btn.contour,#contenu > .btn.contour{background:var(--surface)}
.feuille .bloc .btn.contour,.feuille .carte .btn.contour,.bloc .rang-actions .btn.contour{background:var(--pierre-1)}
.tete .btn.contour:hover,.outils .btn.contour:hover,.feuille .btn.contour:hover{background:var(--sable)}
button,.btn,.chip{transition:transform .14s cubic-bezier(.16,1,.3,1),background-color .14s,opacity .14s}
.btn:active,.chip:active,.geste:active,.barre-bas a:active,.barre-bas button:active,.onglets button:active{transform:scale(.97)}
.rang:active{opacity:.7}

/* ---------- Menus, filtres, bascules : tout passe à la ligne, rien ne sort de l'écran ---------- */
.chips,.onglets,.seg,.a-idees,.commandes .rangee.defile{flex-wrap:wrap;overflow:visible}
.chips{margin:0;padding:0;gap:8px}
.chip{min-height:44px;padding:0 15px;border:0;border-radius:999px;background:var(--pierre-1);font-size:15px;font-weight:600;color:var(--encre)}
.chip:hover{background:var(--pierre-3)}
.chip[aria-pressed="true"]{background:var(--foret);color:var(--sable)}
.chip .n{font-size:13.5px}
.onglets{margin:0 0 16px;padding:0;gap:8px;border-bottom:0}
.onglets button{min-height:44px;padding:0 16px;border:0;border-radius:999px;background:var(--surface);font-size:15px;font-weight:600;color:var(--encre);margin:0}
.onglets button[aria-selected="true"]{background:var(--foret);color:var(--sable)}
.seg{border-radius:26px;padding:4px;gap:2px}
.seg button{min-height:44px;padding:0 14px;border-radius:22px;font-size:15px;color:var(--encre)}
.seg button[aria-pressed="true"]{font-weight:650;box-shadow:0 1px 2px rgba(44,42,40,.16)}
.sel select{min-height:44px;padding:0 38px 0 42px;border:0;border-radius:999px;background:var(--pierre-1);font-size:16px;font-weight:600;color:var(--encre)}
.sel select:hover{background:var(--pierre-3)}
.sel > svg:first-child{left:15px;color:var(--encre-2)}
.sel > svg:last-child{right:14px;color:var(--encre-2)}
.sel.fort select{background:var(--surface);color:var(--foret)}
.sel.fort select:hover{background:var(--sable)}
.sel.actif select{background:var(--foret);color:var(--sable)}
.sel.actif > svg{color:var(--sable)}
.sel select option{color:var(--encre);background:var(--surface)}
.cherche{flex:1 1 200px}
.cherche input{min-height:44px;padding:0 14px 0 42px;border:1.5px solid var(--bord-champ);border-radius:999px;font-size:16px}
.cherche svg{left:15px;top:14px;color:var(--encre-2)}
.cherche input::placeholder,.a-saisie input::placeholder,.recherche input::placeholder{color:var(--encre-3);opacity:1}
.commandes .rangee.defile{margin:0;padding:0}
.commandes .rangee.defile .cherche{display:block}
/* le « i » : un vrai carré de 44 points sous le doigt, sans prendre de place dans la ligne */
.i-btn{width:44px;height:44px;margin:-11px -9px -11px -7px;color:var(--encre-2)}
.i-btn::after{content:none}
.i-btn:hover,.i-btn[aria-expanded="true"]{background:none;color:var(--foret)}
.sur-fonce .i-btn{color:#D6DFD8}
.sur-fonce .i-btn:hover,.sur-fonce .i-btn[aria-expanded="true"]{background:none;color:var(--sable)}
.rond{flex:none}
button.ligne,a.ligne{min-height:48px}
input[type=range]{height:44px}
.interrupteur{box-sizing:content-box;padding:8px 0;background-clip:content-box}
.interrupteur::after{top:11px}
.i-pop{border-radius:16px;padding:12px 15px;font-size:15px;max-width:min(320px,calc(100vw - 24px))}
.bascule{font-size:15px;font-weight:650;min-height:44px}
details.plus > summary{min-height:44px;font-size:15px;font-weight:650}

/* Le choix de la vue : une phrase, des menus déroulants */
/* téléphone : une ligne par menu, le mot à gauche, le menu sur toute la largeur ; écran large : la phrase sur une ligne */
.phrase{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px 10px;margin-bottom:8px}
.phrase .gr{display:contents}
.phrase .sel,.phrase .sel select{width:100%}
@media (min-width:640px){
  .phrase{display:flex;flex-wrap:wrap}
  .phrase .gr{display:inline-flex;align-items:center;gap:8px;max-width:100%}
  .phrase .sel,.phrase .sel select{width:auto}
}
.phrase .mot{font-size:16px;color:var(--encre-2)}
.phrase .sel > svg:first-child{display:none}
.phrase .sel select{padding-left:16px}
.plus-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.plus-f .btn{background:none;padding:0 4px;color:var(--foret)}
.filtres-2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.resume{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding:6px 0 2px;font-size:14.5px;color:var(--encre-2)}
.resume b{font-weight:700;font-size:22px;letter-spacing:-.015em;color:var(--encre);white-space:nowrap}
.legende{margin:8px 0 2px;font-size:13.5px;gap:6px 14px}
.legende .pastille-c,.leg .pastille-c,.chip .pastille-c{border-radius:50%}
/* la part de chaque ligne dans la vue, découpée par classe d'actifs */
.rang .part{grid-column:2/-1;display:block;height:8px;border-radius:999px;background:var(--pierre-0);margin-top:2px;overflow:hidden}
.rang .part > span{display:flex;gap:2px;height:100%;min-width:6px}
.rang .part i{display:block;min-width:3px;border-radius:999px}
.rang.sans-ic .part{grid-column:1/-1}

/* ---------- Champs de saisie : un contour lisible, 16 points pour ne pas déclencher le zoom du téléphone ---------- */
.champ input[type=text],.champ input[type=email],.champ input[type=number],.champ input[type=password],.champ select,.champ textarea{border:1.5px solid var(--bord-champ);border-radius:14px;padding:10px 14px;font-size:16px}
.champ label,.champ .lab{font-size:15px;font-weight:600}
.champ .aide{font-size:14px}
.a-saisie input,.recherche input{border:1.5px solid var(--bord-champ);font-size:16px}
.depot-zone{border-color:var(--bord-champ);border-radius:22px}
.cases label{min-height:44px;font-size:15.5px}
.coche,.cases input{width:24px;height:24px}
.interrupteur{background:var(--bord-champ)}

/* ---------- Listes : l'arche pour les dessins et les dates ---------- */
.rang{padding:12px 0;min-height:66px;border-bottom-color:var(--pierre-2)}
.rang .ic,.puce{width:44px;height:44px;border-radius:var(--arche);background:var(--pierre-1);color:var(--foret)}
.rang .ic.foret,.puce.foret{background:var(--foret-doux);color:var(--foret)}
.rang .ic.terra,.puce.terra{background:var(--terracotta-doux);color:var(--terracotta-texte)}

.vide{font-size:15px;color:var(--encre-2)}
.date-b{width:54px;height:56px;border-radius:27px 27px 15px 15px;background:var(--pierre-1);padding-top:4px}
.date-b b{font-weight:700;font-size:20px}
.date-b small{font-size:13px;font-weight:600;color:var(--encre-2);margin-top:2px}
.rang.proche .date-b{background:var(--terracotta);color:#fff}
.rang.proche .date-b small{color:#fff}
.rang.proche .s{color:var(--terracotta-texte);font-weight:650}
.jauge{height:10px;border-radius:999px}
.jauge > span{border-radius:999px}
.strates{border-radius:999px}
.leg button,.leg .l{font-size:15.5px;min-height:44px}
.leg .pc{font-size:14.5px;color:var(--encre-2)}
.leg .va{font-weight:700}
.barre-r{display:flex;gap:3px;height:18px;margin:2px 0 8px}
.barre-r span{display:block;border-radius:7px;min-width:8px}

/* ---------- Les gestes fréquents : quatre arches, la palette en une rangée ---------- */
.gestes{gap:4px}
.geste{background:none;border:0;box-shadow:none;padding:4px 2px 6px;gap:8px;border-radius:18px;font-size:13.5px;font-weight:650;line-height:1.2;text-wrap:balance}
.geste .ic{width:58px;height:62px;border-radius:29px 29px 17px 17px}
.geste:nth-child(1) .ic{background:var(--foret);color:var(--sable)}
.geste:nth-child(2) .ic{background:var(--terracotta);color:#fff}
.geste:nth-child(3) .ic{background:var(--ocre-plein);color:var(--encre)}
.geste:nth-child(4) .ic{background:var(--sauge);color:var(--foret)}
@media (max-width:359px){.geste{font-size:13px;padding-left:0;padding-right:0}.geste .ic{width:52px;height:56px;border-radius:26px 26px 15px 15px}}

/* ---------- La marque (provisoire : une lettre dans une arche) et l'assistant ---------- */
.marque-f,.avatar-a{flex:none;display:grid;place-items:center;width:var(--t,44px);height:var(--t,44px);border-radius:var(--arche)}
.marque-f{background:var(--terracotta);color:#fff;font-family:var(--titre);font-weight:800;font-size:calc(var(--t,44px)*.55);line-height:1;padding-top:calc(var(--t,44px)*.07)}
.avatar-a{background:var(--foret);color:var(--sable)}
.rail .marque .marque-f{--t:42px}
.rail-antoine .avatar-a,.antoine .a-tete .avatar-a{--t:40px}
.antoine .a-tete .a-qui{flex:1;min-width:0}

.barre-haut{gap:12px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:color-mix(in srgb,var(--fond) 92%,transparent)}
.barre-haut .accueil-l{flex:1;min-width:0;display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--encre);min-height:44px}
.barre-haut .accueil-l b{font-family:var(--titre);font-weight:700;font-size:20px;letter-spacing:-.015em;white-space:nowrap}
.barre-haut .btn{flex:none;background:var(--surface);color:var(--foret)}
.barre-haut .btn:hover{background:var(--sable)}

.barre-bas a,.barre-bas button{border-radius:26px;min-height:54px;gap:3px;font-size:12.5px;font-weight:650;color:var(--encre-2);align-content:end}
.barre-bas a > svg,.barre-bas button > svg{box-sizing:content-box;width:22px;height:22px;padding:3px 9px;border-radius:999px}
.barre-bas [aria-current="page"]{color:var(--foret);font-weight:750}
.barre-bas [aria-current="page"] > svg{background:var(--foret);color:var(--sable)}
.barre-bas .depot{color:var(--terracotta-texte);font-weight:650}
.barre-bas .depot .pastille{width:52px;height:52px;min-height:0;padding:0;margin-top:-26px;border:0;background:var(--terracotta);color:#fff;box-shadow:0 0 0 5px var(--surface),0 10px 18px -8px rgba(138,61,38,.55)}
main{padding-bottom:calc(124px + env(safe-area-inset-bottom))}
.message{border-radius:18px;font-size:15px;bottom:calc(104px + env(safe-area-inset-bottom))}

/* ---------- Ordinateur : le rail ---------- */
@media (min-width:1020px){
  .rail{background:var(--fond);border-right:0;padding:22px 16px 16px}
  main{padding-bottom:96px}
  .message{bottom:32px}
}
.rail .marque{gap:12px}
.rail .marque b{font-weight:700;font-size:21px;letter-spacing:-.015em}
.rail .marque small,.rail .groupe{font-size:13.5px;color:var(--encre-3)}

.rail nav a svg{color:var(--encre-2)}
.rail nav a[aria-current="page"]{background:var(--foret);color:var(--sable);font-weight:650}
.rail nav a[aria-current="page"] svg{color:var(--sable)}
.rail nav a .compte{background:var(--terracotta)}
.rail nav a[aria-current="page"] .compte{background:var(--sable);color:var(--foret)}

.rail-antoine b{font-size:15px;font-weight:650}
.rail-antoine small{font-size:13px}
.rail .pied{font-size:13px}
.rail :focus-visible{outline-color:var(--foret)}
.outils .btn{font-size:15px}

.voile{background:rgba(44,42,40,.46)}

.feuille .f-tete h2{font-size:22px}
.feuille .poignee{background:var(--pierre-3)}

.menu-groupes h3{font-size:14px;font-weight:600}
.menu-groupes a,.menu-groupes button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 4px;border-bottom:1px solid var(--pierre-2);font-size:16px;font-weight:600;color:var(--encre);text-decoration:none}
.menu-groupes a .compte{background:var(--terracotta)}
.menu-groupes button svg{color:var(--encre-2)}

.antoine{background:var(--fond)}
.antoine .a-tete{border-bottom:0;background:var(--fond)}
.antoine .a-tete b{font-weight:700;font-size:19px}
.antoine .a-tete small{font-size:13.5px}
.msg{border-radius:20px;padding:12px 15px;font-size:15.5px}
.msg.a{border:0;border-bottom-left-radius:6px}
.msg.v{border-bottom-right-radius:6px}
.msg .source{font-size:13.5px}
.msg .btn{min-height:44px;font-size:15px}
.a-idees{padding:0 16px 12px}
.a-idees button{flex:1 1 auto;max-width:none;min-height:44px;padding:9px 14px;border:0;border-radius:18px;background:var(--pierre-1);font-size:14.5px;font-weight:500}

.a-saisie{border-top:0;background:var(--fond)}
.a-saisie input{background:var(--surface)}
.a-cadre{background:var(--fond);font-size:13px}

/* ---------- Mouvement réduit : aucune animation ne tourne en boucle ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-iteration-count:1!important}
  .btn:active,.chip:active,.geste:active,.barre-bas a:active,.barre-bas button:active,.onglets button:active{transform:none}
}

function lignes() {

}
function ligne(id) { return lignes().find(l => l.id === id); }
function somme(t, f) { return t.reduce((s, x) => s + f(x), 0); }

function dettes() { return somme(FICTIF.dettes, d => d.restant); }
function net() { return brut() - dettes(); }

  const r = {}; ORDRE_CLASSES.forEach(c => { r[c] = 0; });

    if (l.composition) l.composition.forEach(p => { r[p.classe] += p.valeur; });
    else r[l.classe] += l.valeur;
  });

}

const PERIMETRES = [['famille', 'Toute la famille'], ['Claire', 'Claire'], ['Étienne', 'Étienne'], ['Jules', 'Jules'], ['Alice', 'Alice'], ['SCI Lambert', 'SCI Lambert']];
/* Part de la société civile revenant à une personne. Chaque parent garde 30 % des parts en pleine propriété ; les 40 %
   donnés sont partagés au barème fiscal entre l'usufruit du parent donateur et la nue-propriété de l'enfant. */
function partSociete(perim) {
  const uC = tauxUsufruit(age(membre('Claire').naissance)), uE = tauxUsufruit(age(membre('Étienne').naissance));
  if (perim === 'Claire') return 0.30 + 0.20 * uC;
  if (perim === 'Étienne') return 0.30 + 0.20 * uE;
  return 0.10 * (1 - uC) + 0.10 * (1 - uE);
}
/* Part d'un bien revenant au périmètre choisi. Biens communs : moitié pour chaque époux. */
function partDe(titulaire, perim) {
  if (perim === 'famille') return 1;
  if (perim === 'SCI Lambert') return titulaire === 'SCI Lambert' ? 1 : 0;
  if (titulaire === perim) return 1;
  const parent = perim === 'Claire' || perim === 'Étienne';
  if (titulaire === 'Claire et Étienne') return parent ? 0.5 : 0;
  if (titulaire === 'SCI Lambert') return partSociete(perim);
  return 0;
}
function lignesPerim() {
  const p = etat.f.perimetre;
  return lignes().map(l => {
    const k = partDe(l.titulaire, p);
    if (!k) return null;
    return Object.assign({}, l, { valeur: l.valeur * k, part: k, composition: l.composition ? l.composition.map(c => Object.assign({}, c, { valeur: c.valeur * k })) : undefined });
  }).filter(Boolean);
}
function dettesPerim() {
  const p = etat.f.perimetre;
  return FICTIF.dettes.map(d => { const k = partDe(d.porteur, p); return k ? Object.assign({}, d, { restant: d.restant * k, part: k }) : null; }).filter(Boolean);
}

  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) {
    if (d[i - 1] * d[i] <= 0) { m[i] = 0; continue; }
    const h0 = pts[i][0] - pts[i - 1][0], h1 = pts[i + 1][0] - pts[i][0];
    m[i] = 3 * (h0 + h1) / ((2 * h1 + h0) / d[i - 1] + (h1 + 2 * h0) / d[i]);
  }
  let c = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
  for (let i = 0; i < n - 1; i++) {
    const h = (pts[i + 1][0] - pts[i][0]) / 3;
    c += ' C' + (pts[i][0] + h).toFixed(1) + ' ' + (pts[i][1] + m[i] * h).toFixed(1) + ' ' + (pts[i + 1][0] - h).toFixed(1) + ' ' + (pts[i + 1][1] - m[i + 1] * h).toFixed(1) + ' ' + pts[i + 1][0].toFixed(1) + ' ' + pts[i + 1][1].toFixed(1);
  }
  return c;
}

/* Survol, toucher et clavier : un trait vertical trouve la date, la bulle donne la valeur */
function brancherSurvol(el, svg, positions, contenu) {
  const bulle = document.createElement('div');
  bulle.className = 'bulle';
  el.appendChild(bulle);
  const trait = svg.querySelector('.trait-survol');
  let courant = -1;
  function montrer(i) {
    if (i < 0 || i >= positions.length) return;
    courant = i;
    const p = positions[i];
    trait.setAttribute('x1', p.x); trait.setAttribute('x2', p.x); trait.style.opacity = 1;
    bulle.textContent = '';
    contenu(i).forEach(l => {
      const ligne = document.createElement(l.fort ? 'b' : 'span');
      if (l.cle) { const k = document.createElement('i'); k.style.background = l.cle; ligne.appendChild(k); }
      ligne.appendChild(document.createTextNode(l.texte));
      if (!l.fort) ligne.style.display = 'block';
      bulle.appendChild(ligne);
    });
    bulle.classList.add('vue');
    const largeur = el.clientWidth, lb = bulle.offsetWidth;
    const gauche = Math.max(0, Math.min(largeur - lb, p.x - lb / 2));
    const haut = Math.max(0, p.y - bulle.offsetHeight - 14);
    bulle.style.transform = 'translate(' + gauche + 'px,' + haut + 'px)';
  }
  function cacher() { courant = -1; trait.style.opacity = 0; bulle.classList.remove('vue'); }
  function plusProche(ev) {
    const r = svg.getBoundingClientRect();
    const x = ev.clientX - r.left;
    let m = 0, dm = Infinity;
    positions.forEach((p, i) => { const d = Math.abs(p.x - x); if (d < dm) { dm = d; m = i; } });
    return m;
  }
  svg.addEventListener('pointermove', ev => montrer(plusProche(ev)));
  svg.addEventListener('pointerdown', ev => montrer(plusProche(ev)));
  svg.addEventListener('pointerleave', cacher);
  svg.addEventListener('blur', cacher);
  svg.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowRight') { montrer(Math.min(positions.length - 1, courant < 0 ? 0 : courant + 1)); ev.preventDefault(); }
    if (ev.key === 'ArrowLeft') { montrer(Math.max(0, courant < 0 ? positions.length - 1 : courant - 1)); ev.preventDefault(); }
  });
}

/* Série du patrimoine net limitée à la période choisie (en années, à partir du dernier point) */
function serieNetPeriode() {
  const pts = serieNet(), n = Number(etat.f['pat-periode']);
  if (n >= 5) return pts;
  const d = decoupe(pts[pts.length - 1].date), borne = (d.a - n) + '-' + String(d.m).padStart(2, '0') + '-' + String(d.j).padStart(2, '0');
  return pts.filter(p => p.date >= borne);
}

  const t0 = Date.parse(pts[0].date), t1 = Date.parse(pts[pts.length - 1].date);

  const pas = [20000, 50000, 100000, 200000, 500000].find(x => (vmax - vmin) / x <= 3.2) || 500000;
  const y0 = Math.floor(vmin / pas) * pas, y1 = Math.max(y0 + pas, Math.ceil(vmax / pas) * pas);
  const Y = v => m.h + (1 - (v - y0) / (y1 - y0)) * (H - m.h - m.b);
  const etiq = v => (v / 1e6).toFixed(pas < 100000 ? 2 : 1).replace('.', ',') + INSEC + 'M€';

  for (let v = y0; v <= y1 + 1; v += pas) {
    s += '<line x1="' + m.g + '" x2="' + (L - m.d) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--filet)" stroke-width="1"/>';
    s += '<text x="0" y="' + (Y(v) + 4) + '">' + etiq(v) + '</text>';

  });

  s += '<path d="' + courbe + ' L' + xy[xy.length - 1][0].toFixed(1) + ' ' + (H - m.b) + ' L' + xy[0][0].toFixed(1) + ' ' + (H - m.b) + ' Z" fill="url(#aire-evo)"/>';
  s += '<line class="trait-survol" y1="' + m.h + '" y2="' + (H - m.b) + '" stroke="var(--encre-3)" stroke-width="1" style="opacity:0"/>';
  s += '<path d="' + courbe + '" fill="none" stroke="var(--foret)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  const f = xy[xy.length - 1];
  s += '<circle cx="' + f[0] + '" cy="' + f[1] + '" r="6" fill="var(--soleil)" stroke="var(--surface)" stroke-width="3"/>';
  s += '<g class="mnt-g"><text class="valeur-fin" x="' + f[0] + '" y="' + (f[1] - 12) + '" text-anchor="end">' + eur(pts[pts.length - 1].v) + '</text></g>';
  s += '<rect x="0" y="0" width="' + L + '" height="' + H + '" fill="transparent"/></svg>';
